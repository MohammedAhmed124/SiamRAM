services:
  gpu:
    build: .
    image: siamram
    command: ["bash", "-lc", "sleep infinity"]
    volumes:
      - .:/app
      - siamram_venv:/app/.venv
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  cpu:
    image: siamram
    command: ["bash", "-lc", "sleep infinity"]
    volumes:
      - .:/app
      - siamram_venv:/app/.venv

volumes:
  siamram_venv:
