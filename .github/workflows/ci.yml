name: CI

on:
  push:
    paths:
      - "**"
  pull_request:
    branches: [ master, dev ] # Always run on PRs (any files changed)

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run ruff check
        run: |
          uv run ruff check .

      - name: Run ty check
        run: |
          uv run ty check
