services:
  gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: siamram-gpu
    command: ["bash", "-lc", "sleep infinity"]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - .:/app
      - siamram_venv_gpu:/app/.venv
      - C:/Users/afara/PycharmProjects/SiamRAM-final/Data:/app/data:ro
      - siamram_training:/app/training_data
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  siamram_venv_gpu:
  siamram_training:
