# Absolute path to the checkpoint loaded for inference initialization.
# This file provides model weights before any frame processing begins.
weights_path: "/home/moha/SiamRAM/checkpoints/inference_checkpoint.pth"

# Model construction block for the SiamABC network instance.
# All keys below are forwarded into the model constructor.
model:
  # Import path used by Hydra to instantiate the model class.
  # Changing this swaps the model implementation without code edits.
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  # Backbone architecture identifier used inside SiamABCNet.
  # This selects the feature extractor family for template/search branches.
  backbone: custom_fbnet
  # Width scaling multiplier applied to backbone channel dimensions.
  # Higher values increase model capacity and compute cost.
  growth_factor: 1.2
  # Upsampling strategy used by decoder or head feature maps.
  # This affects output resolution quality and runtime speed.
  upsample: pixel_shuffle
  # Enables pretrained initialization for supported backbone layers.
  # If false, compatible layers are initialized from scratch.
  pretrained: true
  # Number of output prediction classes produced by the head.
  # SiamRAM uses 1 for single-target foreground/background behavior.
  num_classes: 1
  # Base channel count used by head/filter branches.
  # Larger values improve representation at higher compute cost.
  num_filters: 32
  # Input image channel count expected by the model.
  # Standard RGB inference should keep this set to 3.
  num_channels: 3
  # Enables alignment correction on feature operations when supported.
  # This can improve geometric consistency at slight compute overhead.
  align: false
  # Input spatial size used for model preprocessing assumptions.
  # Must stay consistent with tracker template/search crop sizing.
  img_size: 256
  # Feature stride used by model heads for spatial downsampling.
  # Impacts score-map resolution and localization granularity.
  stride: 2
  # Convolution block type used across model stages.
  # Selects implementation variant for speed/accuracy tradeoffs.
  conv_block: sep_conv
  # Number of repeated towers/branches used in the detection head.
  # Increasing this deepens head capacity and latency.
  towernum: 2
  # Preset model scale variant consumed by internal build logic.
  # Typical values map to small/medium/large channel-depth presets.
  model_size: M
  # Maximum stage depth enabled during model construction.
  # Limits how many backbone levels participate in feature extraction.
  max_layer: 4
  # Crops template features before fusion when enabled.
  # Useful for restricting context around the target exemplar.
  crop_template_features: false
  # Enables the IoU prediction head in the model outputs.
  # Required for tracker modes that use IoU-aware scoring or gating.
  build_iou_head: true

# Tracker construction block for SiamABC runtime behavior.
# Keys below tune scoring, update, and gating during tracking.
tracker:
  # Import path used by Hydra to instantiate the tracker class.
  # Changing this swaps the tracker implementation entrypoint.
  _target_: models.SiamABC.tracker.SiamABC_Tracker.SiamABCTracker
  # Exponential penalty strength for scale/ratio changes in candidates.
  # Higher values suppress abrupt box-shape changes more strongly.
  penalty_k: 0.062
  # Blend factor for cosine window regularization on scores.
  # Larger values bias selection toward central/expected positions.
  window_influence: 0.38
  # Interpolation rate used when updating target state each frame.
  # Higher values follow new observations more aggressively.
  lr: 0.4
  # Window function type used for spatial score smoothing.
  # Common options include cosine and uniform variants.
  windowing: cosine
  # Effective network stride used to map score cells to pixels.
  # Must match model head stride for correct coordinate decoding.
  total_stride: 16
  # Spatial width/height of the score map used for candidate search.
  # Controls candidate grid density in tracker localization.
  score_size: 16
  # Number of proposals/candidates evaluated during update logic.
  # Larger values can improve robustness with additional compute.
  N: 40 #10
  # Enables dynamic template/memory updates during tracking.
  # If false, tracker remains closer to fixed-template behavior.
  dynamic_update: true
  # Enables auxiliary similarity score usage in candidate ranking.
  # When false, ranking relies on primary tracking scores only.
  similarity_score: false
  # Tracker-side stride used in coordinate or crop computations.
  # Keep aligned with model/tracker assumptions for stable mapping.
  stride: 2
  # Enables additional temporal smoothing on predicted trajectory.
  # Reduces jitter but can add slight lag on fast motion.
  smooth: false
  # Width/height ratio weighting used in bbox adaptation logic.
  # Adjusts how box shape is preserved during updates.
  bbox_ratio: 0.5
  # Offset factor when deriving template bbox from target bbox.
  # Controls template crop placement around the object center.
  template_bbox_offset: 0.2
  # Context scale factor around target for search crop creation.
  # Larger values include more background and nearby distractors.
  search_context: 2
  # Pixel size of the search crop fed to the tracker/model.
  # Increasing this enlarges search region at higher cost.
  instance_size: 256
  # Pixel size of the template crop used for exemplar features.
  # Must remain compatible with model template branch expectations.
  template_size: 128
  # Rolling window size used by dynamic memory update routines.
  # Larger windows preserve longer-term appearance history.
  memory_window_size: 60  #20
  # Confidence threshold required to admit dynamic template updates.
  # Prevents low-quality frames from contaminating tracker memory.
  dynamic_update_threshold: 0.85
  # Lower confidence clamp used in running confidence smoothing.
  # Keeps update logic from collapsing on transient weak frames.
  running_confidence_floor_value: 0.50
  # IoU threshold used in continuity/quality checks for boxes.
  # Higher values require tighter overlap to pass IoU-based tests.
  iou_threshold: 0.6
  # Number of startup frames treated as warmup behavior window.
  # Some gates/updates are relaxed or delayed during this period.
  warmup_frames: 35
  # Sliding window length used by warmup-specific statistics.
  # Tunes responsiveness of warmup confidence smoothing.
  warmup_window_size: 8
  # Enables multiplying scores by predicted IoU quality.
  # Can improve localization quality when IoU head is reliable.
  use_iou_score: false
  # Exponent applied to IoU score when IoU scoring is enabled.
  # Values above 1 amplify high-IoU preference.
  iou_power: 1.0
  # Enables IoU threshold gating for candidate acceptance.
  # Rejects candidates with weak IoU consistency when true.
  use_iou_gate: False
  # Applies IoU gate specifically during final score selection.
  # This can filter top-scoring but geometrically inconsistent boxes.
  use_iou_gate_for_score: false
  # Warmup duration before enabling IoU gate checks.
  # Avoids unstable IoU gating during earliest frames.
  iou_gate_warmup_frames: 20
  # EMA smoothing factor for IoU-gate internal statistics.
  # Higher beta gives longer memory and smoother gate behavior.
  iou_gate_ema_beta: 0.9
  # Enables EMA-smoothed signal instead of raw IoU gate input.
  # Improves stability when per-frame IoU estimates are noisy.
  iou_gate_use_ema: true
  # IoU gate threshold used to pass/reject candidates.
  # Lower values are permissive; higher values are stricter.
  iou_gate_threshold: 0.2
  # Controls fallback when IoU gate cannot make a safe decision.
  # True blocks updates on gate uncertainty; false allows pass-through.
  iou_gate_fail_closed: false



# Controls whether TensorRT engine build path should run.
# When false, inference uses the standard runtime implementation.
make_trt_engine: False

# Selects which SiamRAM tracker wrapper gets instantiated at runtime.
# Use "experiment" for jump-rejection logic and "base" for legacy behavior.
ram_tracker_impl: "experiment"

# Holds parameters that are only read by the experimental tracker wrapper.
# These keys are ignored when ram_tracker_impl is set to "base".
ram_tracker_experiment:
  # Enables hard-jump rejection logic during normal tracking updates.
  # When false, the tracker accepts jumps without the spike/watch workflow.
  spike_reject_enabled: True
  # Sets minimum tracked frames before spike rejection can activate.
  # Prevents unstable early-frame motion from triggering false spikes.
  spike_reject_min_frames: 3
  # Defines minimum tracker confidence required to run spike checks.
  # Low-confidence frames below this value skip spike rejection decisions.
  spike_reject_min_score: 0.0
  # Controls the lookback window used to estimate normal motion statistics.
  # Larger windows smooth motion baseline but react slower to changes.
  spike_reject_history_window: 40
  # Requires this many valid history samples before using motion baseline.
  # Prevents ratio-based spike logic from running with insufficient history.
  spike_reject_min_history: 5

  # Multiplies baseline motion to set the spike-trigger speed threshold.
  # A candidate above this ratio is treated as a potential hard jump.
  spike_reject_ratio: 2.5
  # Sets absolute minimum normalized motion needed to flag a spike.
  # Keeps tiny displacements from triggering spike rejection.
  spike_reject_abs_norm_min: 0.0

  # Ratio threshold to consider motion "settled" after a spike event.
  # Lower values require stronger slowdown before committing a new target.
  spike_reject_settle_ratio: 0.7
  # Absolute normalized motion cap for settle validation.
  # Motion must be at or below this value to count as stabilized.
  spike_reject_settle_abs_norm_max: 0.30
  # Number of consecutive settled frames required for commit.
  # Increases robustness against one-frame settle noise.
  spike_reject_settle_frames: 1
  # Maximum frames to stay in spike-watch mode before timeout fallback.
  # Prevents the watcher from staying active indefinitely.
  spike_reject_watch_max_frames: 8
  # Required fractional drop from spike magnitude to allow settle.
  # Higher values enforce stronger recovery before committing.
  spike_reject_settle_from_spike_frac: 0.55

  # Enables similarity-based appearance gating during spike handling.
  # When false, spike decisions rely only on motion and score dynamics.
  spike_reject_use_appearance: false
  # Sets similarity boundary used by appearance spike gating.
  # This value is ignored when spike_reject_use_appearance is false.
  spike_reject_max_sim: 0.65

  # Duration in frames to keep distractor mode active after commit.
  # Longer durations add caution before returning to normal behavior.
  jump_reject_distractor_mode_frames: 12
  # Toggles cosine-based score penalty against stored distractor embeddings.
  # Helps suppress candidates that look similar to known distractors.
  jump_reject_distractor_penalty_enabled: true
  # Maximum score reduction applied by distractor penalty.
  # Higher values more aggressively down-rank distractor-like candidates.
  jump_reject_distractor_penalty_weight: 0.25
  # Similarity floor before distractor penalty starts to apply.
  # Candidates below this similarity receive no distractor penalty.
  jump_reject_distractor_penalty_sim_floor: 0.55
  # Limits penalty comparison to the most recent K distractor entries.
  # Keeps penalty focused on current scene distractors and cheaper to compute.
  jump_reject_distractor_penalty_bank_topk: 5
  # Minimum top-candidate similarity needed to remain in distractor mode.
  # Distractor mode exits once similarity persistently drops below this gate.
  distractor_mode_min_similarity: 0.70
  # Minimum similarity required for the selected top ROI candidate.
  # Candidates below this value are rejected even if top-ranked.
  distractor_mode_selected_min_similarity: 0.7
  # Maximum number of ROI candidates evaluated by OSNet per frame.
  # Use 0 to evaluate all candidates (still bounded by global OSNet caps).
  distractor_mode_yolo_topk: 8
  # Maximum target-embedding history length used for ROI similarity scoring.
  # Larger history improves stability but increases compute and inertia.
  distractor_mode_history_limit: 80
  # Reuses tracker mapping size to shape distractor-mode ROI at entry.
  # Maintains prior scale context while center follows real-target focus.
  distractor_mode_use_tracker_mapping: true
  # Expands ROI around current focus before running YOLO in distractor mode.
  # Higher values search wider area but include more clutter.
  distractor_mode_roi_expand: 1.20
  # Enforces a minimum ROI side length (pixels) for detector crops.
  # Avoids tiny ROIs that produce unstable detections.
  distractor_mode_roi_min_side: 32
  # Appearance-weight coefficient for distractor-mode DRM ranking.
  # Higher values prioritize embedding similarity over other terms.
  distractor_drm_lam_app: 1.00
  # IoU-weight coefficient in distractor-mode DRM ranking.
  # Encourages candidates spatially consistent with expected focus box.
  distractor_drm_lam_iou: 0.25
  # Distance-penalty coefficient in distractor-mode DRM ranking.
  # Penalizes candidates whose centers drift far from expected focus.
  distractor_drm_lam_dist: 1
  # Negative-bank suppressor weight for distractor-mode DRM scoring.
  # Higher values more strongly down-rank known distractor appearances.
  distractor_drm_gamma: 2
  # Controls distance penalty growth rate with center offset.
  # Larger sigma factors make distance penalties increase more gradually.
  distractor_drm_dist_sigma_factor: 2.5
  # Uses only the most recent K distractors for negative similarity penalty.
  # Restricts suppressor memory to recent distractor context.
  distractor_drm_bank_topk: 5
  # Selects distractor ranking strategy ("ram" or "drm").
  # "ram" uses appearance-only ranking while "drm" adds motion/spatial terms.
  distractor_compare_mode: "ram"
  # Controls whether RAM/DRM memory admissions happen in distractor mode.
  # Disabling updates helps avoid contaminating memory with distractors.
  distractor_mode_update_memory: false
  # Re-initializes dynamic template/search state when exiting distractor mode.
  # Static template remains unchanged; only dynamic state is refreshed.
  distractor_mode_exit_reinit_enabled: true
  # Consecutive stable frames required before distractor-mode exit.
  # Prevents immediate exit on short-lived stabilization.
  distractor_mode_exit_stable_frames: 6
  # IoU continuity threshold to treat consecutive detections as same object.
  # Exit logic requires current-vs-previous real box IoU above this value.
  distractor_mode_exit_same_iou: 0.60
  # Enables dedicated EKF anchor propagation while in distractor mode.
  # Maintains a motion prior when appearance cues are ambiguous.
  distractor_mode_anchor_ekf_enabled: true
  # Scales EKF uncertainty into additional ROI padding.
  # Set 0 to disable uncertainty-driven ROI growth.
  distractor_mode_anchor_uncertainty_roi_scale: 0.0
  # Caps uncertainty-based ROI padding to this pixel value.
  # Prevents runaway ROI growth during prolonged uncertainty.
  distractor_mode_anchor_uncertainty_roi_cap: 96.0
  # Enables Mahalanobis gating against EKF-predicted anchor state.
  # Rejects motion-inconsistent detections before ranking.
  distractor_mode_mahalanobis_gate_enabled: true
  # Chi-square threshold used by Mahalanobis candidate gating.
  # Lower values tighten motion consistency requirements.
  distractor_mode_mahalanobis_threshold: 9.21
  # Adds measurement variance term (px^2) to Mahalanobis gating model.
  # Higher values make the gate less sensitive to measurement noise.
  distractor_mode_mahalanobis_meas_var: 25.0
  # Minimum score margin between top-1 and top-2 to allow identity switch.
  # Prevents switching when ranking is ambiguous.
  distractor_mode_switch_margin: 0.08
  # Frames to hold current anchor during ambiguity before switching.
  # Adds temporal hysteresis to reduce ping-pong identity flips.
  distractor_mode_ambiguity_hold_frames: 2
  # Cooldown after resolved exit before distractor mode can re-enter.
  # Helps avoid rapid re-entry loops in unstable scenes.
  distractor_mode_reentry_cooldown_frames: 12
  # Frames to freeze RAM/DRM admissions after distractor-mode exit.
  # Protects memory from noisy post-exit transients.
  distractor_mode_post_exit_memory_freeze_frames: 8
  # Frames to freeze dynamic template updates after distractor-mode exit.
  # Prevents immediate template drift after identity recovery.
  distractor_mode_post_exit_template_freeze_frames: 8
  # Selects distractor behavior logic variant.
  # "overlap_motion_lock" favors motion-lock holding under heavy overlap.
  distractor_mode_behavior_mode: "standard"
  # Enables overlap-motion lock when candidate overlaps distractors heavily.
  # Holds motion-model box instead of switching identity in overlap cases.
  distractor_mode_overlap_motion_lock_enabled: true
  # Overlap IoU threshold that activates overlap-motion lock.
  # Lock enters once best-candidate overlap reaches this level.
  distractor_mode_overlap_iou_enter: 0.35
  # Overlap IoU threshold considered clear for lock release.
  # Lock can release when overlap drops to or below this value.
  distractor_mode_overlap_iou_exit: 0.15
  # Consecutive clear-overlap frames required to release lock.
  # Adds stability so lock does not toggle on single-frame dips.
  distractor_mode_overlap_clear_frames: 3
  # Hard cap on overlap-motion lock duration in frames.
  # Forces release if lock persists longer than this safety limit.
  distractor_mode_overlap_lock_max_frames: 24
  # Enables extra distance penalty from snapped target focus area.
  # Reduces selection of far-away candidates during distractor handling.
  distractor_focus_dist_penalty_enabled: true
  # Maximum additional score reduction from focus-distance penalty.
  # Higher values enforce tighter adherence to focus region.
  distractor_focus_dist_penalty_weight: 0.35
  # Normalized radius with zero focus-distance penalty.
  # Candidates inside this radius are not distance-penalized.
  distractor_focus_dist_soft_radius: 0.60
  # Normalized radius where full focus-distance penalty is reached.
  # Candidates beyond this radius receive maximum distance penalty.
  distractor_focus_dist_hard_radius: 2.00
  # Forces immediate occlusion mode entry right after jump commit.
  # When false, tracker stays in normal mode with distractor penalties.
  jump_reject_force_occlusion: false

# TensorRT export/runtime options used when make_trt_engine is enabled.
# These values control precision and hardware selection for engine build.
trt_engine:
  # Test-time augmentation blend factor used by TRT inference wrapper.
  # Higher values increase augmentation influence on final predictions.
  lambda_tta: 0.1
  # Enables FP16 precision for TensorRT engine building and execution.
  # Reduces memory and latency on supported GPUs.
  fp16: True
  # CUDA device index used for TensorRT build/runtime execution.
  # Set this to the target GPU ID in multi-GPU systems.
  cuda_id: 0

# --------------------------------------------------------------------------- #
# SiamRAMTracker (Occlusion & DRM Management)
# --------------------------------------------------------------------------- #
# Runtime control block for SiamRAM occlusion and recovery logic.
# Keys below tune detector use, memory, motion, and re-acquisition behavior.
ram_tracker:
  # Path to YOLO model weights used for detection/re-detection.
  # This file is loaded when detector-assisted recovery is needed.
  yolo_weights: "checkpoints/yolo11n.pt"
  # Minimum YOLO detection confidence kept as a candidate.
  # Lower values increase recall but add more false positives.
  yolo_conf: 0.3
  # Restricts YOLO outputs to the currently inferred target class.
  # Helps reduce distractor detections in class-consistent scenes.
  yolo_filter_class: false
  # Number of frames used to build early target-class votes.
  # Higher values stabilize class inference but delay lock-in.
  yolo_class_detect_frames: 5
  # Enables compiled/optimized YOLO execution path when available.
  # Can improve latency if compiled artifacts are present.
  copile_yolo: False

  # Appearance descriptor backend used for re-identification matching.
  # Current supported backend in this project is "osnet".
  descriptor_backend: "osnet"
  # OSNet variant name resolved via torchreid model registry.
  # Larger variants improve discrimination with additional compute.
  osnet_model_name: "osnet_x1_0"
  # Selects pretrained OSNet weights source for descriptor extraction.
  # Options: "imagenet", "reid_market1501", "reid_dukemtmcreid", "reid_msmt17", "reid_msmt17_combineall", "custom".
  osnet_pretrained_checkpoint: "reid_market1501"  # or imagenet/reid_dukemtmcreid/reid_msmt17/reid_msmt17_combineall/custom
  # Optional local OSNet checkpoint path override.
  # If set, this path takes priority over osnet_pretrained_checkpoint.
  osnet_model_path: ""
  # Device choice for descriptor extraction runtime.
  # Use "auto" to pick CUDA when available, otherwise CPU.
  osnet_device: "auto"
  # Maximum per-frame detections passed into descriptor extraction.
  # Use 0 or -1 to disable this cap.
  osnet_max_candidate_batch: 5
  
  # Core Thresholds & Hysteresis
  # Minimum tracker confidence considered reliable for normal updates.
  # Values below this can trigger conservative handling or mode changes.
  conf_threshold: 0.50
  # Score threshold required to accept detector-based re-acquisition.
  # Higher values reduce false reacquisition but can miss weak targets.
  reacq_threshold: 0.75
  # Consecutive confident frames required before exiting occlusion recovery.
  # Stage-3 success must hold this many frames at/above reacq_threshold.
  reacq_confirm_frames: 1
  # Siam-branch threshold to confirm recovery during occlusion workflow.
  # Acts as a stricter gate before exiting occlusion mode.
  occ_siam_reacq_threshold: 0.8
  # Minimum appearance-match score to treat a candidate as valid identity.
  # Higher values enforce stronger visual consistency with target memory.
  app_match_threshold: 1
  # Required margin for occlusion decisions between competing candidates.
  # Larger margin demands clearer winner before committing updates.
  occ_siam_margin: 0.8
  # Blending factor for small corrective nudges to predicted state.
  # Zero disables nudging; higher values apply stronger correction.
  nudge_alpha: 0.0
  # Consecutive-frame patience before committing occlusion entry actions.
  # Helps suppress one-frame confidence dips from causing mode flips.
  entry_patience: 1
  # Enables automatic transition to occlusion mode on target loss.
  # If false, tracker stays in normal mode despite weak evidence.
  enter_occlusion_on_loss: True
  # Blocks distractor mode when heavy camera motion is detected.
  # Prevents false distractor triggers caused by global scene shifts.
  block_distractor_mode_on_camera_motion: True
  # Blocks entering occlusion mode under strong camera motion.
  # Avoids misclassifying global movement as target disappearance.
  block_occlusion_on_camera_motion: True
  # Pixel displacement threshold for classifying camera motion as heavy.
  # Used by camera-motion safety gates for mode blocking.
  camera_motion_heavy_disp_threshold: 15.0
  # Normalized displacement threshold for heavy camera motion.
  # Complements pixel threshold for resolution-independent gating.
  camera_motion_heavy_norm_threshold: 0.35
  # Early-frame index cutoff for forcing early-occlusion behavior.
  # If >=0, occlusion entered at frame_idx <= this value uses early mode.
  early_occlusion_entry_n_frames: -1
  # Legacy frame-duration early-occlusion flag after reacquisition.
  # Used only when early_occlusion_entry_n_frames is set below 0.
  early_occlusion_max_frames: -1
  # Uses RAM matching first until DRM memory bank reaches full capacity.
  # Helps stabilize recovery before switching fully to DRM behavior.
  occlusion_use_ram_until_drm_full: False
  # Warmup frame count using center-focused ROI search behavior.
  # Applied in startup or after failed recovery/reset episodes.
  yolo_warmup_frames: 0
  # Center-crop scale used by warmup ROI generation.
  # Smaller values tighten search around frame center.
  yolo_warmup_center_scale: 0.4
  # Max allowed long-edge resolution for processing frames.
  # Caps compute cost while preserving tracking behavior consistency.
  max_proc_long_edge: 1280
  
  # Dynamic Recovery Module (DRM)
  # Frames used to collect candidate set before DRM decision update.
  # Larger windows improve context at the cost of responsiveness.
  cand_collection_frames: 1
  # Similarity threshold used in DRM candidate matching/association.
  # Higher values require tighter appearance agreement.
  drm_tau_sim: 0.6
  # Minimum support count required for DRM memory usage/promotion.
  # Prevents low-evidence entries from driving re-identification.
  drm_mmin: 3
  # Maximum number of entries stored in DRM memory bank.
  # Older entries are evicted once this capacity is reached.
  drm_capacity: 50
  # Decision margin required by DRM scoring to accept winner.
  # Higher margins reduce ambiguous re-identification switches.
  drm_margin: 0.8
  # Threshold used to skip DRM updates under low-quality conditions.
  # Helps avoid memory contamination from noisy detections.
  drm_skip_threshold: 23
  # Number of top-ranked DRM candidates evaluated per decision step.
  # Increasing this can improve robustness with extra computation.
  drm_top_k: 3
  # Global penalty/suppressor weight applied in DRM scoring.
  # Larger values strengthen negative evidence suppression.
  drm_gamma: 0
  
  # DRM Weights (Lambda)
  # Appearance similarity weight in composite DRM score.
  # Higher values favor visual match over motion terms.
  drm_lam_app: 1
  # Candidate-velocity consistency weight in DRM ranking.
  # Raises preference for motion-compatible detections.
  drm_lam_cand_vel: 0.0
  # Spatial distance penalty weight in DRM ranking.
  # Non-zero values penalize candidates far from expected location.
  drm_lam_dist: 0.0
  # Candidate-direction consistency weight for DRM scoring.
  # Encourages heading-consistent reacquisition choices.
  drm_lam_cand_dir: 0.0
  # Temporal recency weight used in DRM candidate scoring.
  # Higher values prioritize fresher observations.
  drm_lam_time: 0.3
  # IoU overlap weight component in DRM ranking.
  # Non-zero values favor candidates overlapping expected box.
  drm_lam_iou: 0.0
  # Motion-model agreement weight in DRM score composition.
  # Increases importance of kinematic consistency.
  drm_lam_mot: 0.0
  
  # Velocity & Motion
  # Minimum speed required before velocity-based terms are trusted.
  # Avoids unstable direction/velocity math near zero motion.
  vel_score_min_speed: 0.5
  # Hard directional gate threshold for candidate acceptance.
  # Rejects candidates with direction mismatch beyond this limit.
  vel_dir_hard_gate: 0.4
  # Window length used for averaged target velocity estimation.
  # Larger windows smooth motion but react slower to changes.
  velocity_window_average: 200
  
  # Memory & History
  # Capacity of RAM appearance memory bank entries.
  # Controls how much historical target appearance is retained.
  mem_capacity: 50
  # Exponential decay factor applied to historical memory confidence.
  # Higher decay discounts older evidence more aggressively.
  history_decay: 0.1
  # Length of rolling confidence history buffer.
  # Used for stability heuristics and adaptive decisions.
  conf_history_len: 200
  # Length of rolling size-history buffer for bbox statistics.
  # Supports shrinkage checks and scale-stability logic.
  size_history_len: 200
  # Number of most-recent history points excluded from some checks.
  # Reduces bias from immediate transient fluctuations.
  history_skip_last: 8
  # Maximum lookback horizon for shrinkage analysis logic.
  # Larger values catch long trends but increase inertia.
  shrinkage_max_lookback: 30
  
  # ROI Expansion (Normal)
  # Initial ROI expansion in pixels for detector search region.
  # Sets baseline search padding around predicted target box.
  roi_start_expand: 20
  # Base expansion amount used for YOLO search crops.
  # Wider expansion increases recall with extra clutter.
  yolo_search_expand: 100
  # Multiplicative growth factor for expanding search area over time.
  # Applied periodically when reacquisition remains unsuccessful.
  search_expand_growth_factor: 1.4
  # Frame interval between search expansion growth steps.
  # Smaller values make ROI expansion increase faster.
  search_expand_growth_every: 150
  # Maximum allowed normal-mode search expansion in pixels.
  # Prevents unbounded ROI growth in long occlusions.
  search_expand_max: 500.0
  
  # Tiny / Long Distance ROI Parameters
  # Area-fraction threshold marking target as tiny/long-distance.
  # Switches to tiny-target search expansion policy below this value.
  long_distance_area_fraction: 0.030
  # Initial ROI expansion for tiny-target recovery mode.
  # Keeps tiny-target search focused before wider growth.
  tiny_roi_start_expand: 8.0
  # Base YOLO search expansion used in tiny-target mode.
  # Lower than normal expansion to reduce distractor clutter.
  tiny_yolo_search_expand: 20.0
  # Growth factor for tiny-target search expansion progression.
  # Controls how quickly tiny ROI expands during misses.
  tiny_search_expand_growth_factor: 1.3
  # Frame interval for tiny-target expansion growth updates.
  # Smaller values increase expansion rate during recovery.
  tiny_search_expand_growth_every: 50
  # Maximum allowed expansion size in tiny-target mode.
  # Caps tiny-mode search area to avoid oversized sweeps.
  tiny_search_expand_max: 40.0

  # Selects camera-motion estimator implementation used by tracker.
  # Options include "classic", "accurate", and "botsort".
  homography_mode: "classic"
  # Motion transform family used by BoT-SORT-style GMC estimator.
  # Valid values: partial_affine, full_affine, or homography.
  botsort_motion_model: "partial_affine"
  # Downscale factor applied before BoT-SORT feature tracking.
  # Lower values reduce compute; higher values retain more detail.
  botsort_motion_work_scale: 0.65
  # Padding fraction around bbox for building dynamic exclusion masks.
  # Helps isolate background motion from target/object regions.
  botsort_motion_bbox_pad: 0.50
  # Number of grid rows for distributing corner detection.
  # More rows improve spatial coverage for motion estimation.
  botsort_motion_grid_rows: 5
  # Number of grid columns for distributing corner detection.
  # More columns provide denser scene sampling for GMC.
  botsort_motion_grid_cols: 7
  # Corner cap per grid cell during feature detection.
  # Limits per-cell density to balance coverage and speed.
  botsort_motion_max_corners_per_cell: 16
  # Shi-Tomasi quality threshold for accepted corner features.
  # Higher values keep stronger corners and drop weak points.
  botsort_motion_quality_level: 0.01
  # Minimum pixel spacing between detected corner features.
  # Prevents clustering of nearly identical feature points.
  botsort_motion_min_distance: 7
  # Neighborhood block size for corner quality computation.
  # Larger blocks smooth gradients but can miss fine detail.
  botsort_motion_block_size: 7
  # Lucas-Kanade optical-flow window size in pixels.
  # Larger windows handle bigger motion with more smoothing.
  botsort_motion_lk_win_size: 17
  # Pyramid depth used by Lucas-Kanade optical flow tracking.
  # Higher levels support larger inter-frame displacements.
  botsort_motion_lk_max_level: 2
  # Forward-backward optical-flow error threshold for filtering points.
  # Points above this error are discarded as unreliable.
  botsort_motion_fb_max_error: 1.5
  # RANSAC reprojection error threshold for transform fitting.
  # Lower values enforce tighter geometric consistency.
  botsort_motion_ransac_reproj_threshold: 3.0
  # Confidence level target for RANSAC robust fitting.
  # Higher confidence can increase iteration count.
  botsort_motion_ransac_confidence: 0.99
  # Maximum RANSAC iterations allowed per transform estimate.
  # Higher limits improve robustness at additional compute cost.
  botsort_motion_ransac_max_iters: 1500
  # Minimum inlier count required to accept estimated transform.
  # Rejects fits derived from too few motion correspondences.
  botsort_motion_min_inliers: 24
  # Minimum inlier ratio required for transform validity.
  # Guards against transforms dominated by outlier matches.
  botsort_motion_min_inlier_ratio: 0.35
  # Maximum median residual allowed for accepted transform.
  # Rejects globally poor fits even with sufficient inliers.
  botsort_motion_max_median_residual: 4.0
  # Minimum grid-cell coverage with inliers for accepted motion model.
  # Ensures correspondences are spatially distributed.
  botsort_motion_min_coverage_cells: 5
  # Translation magnitude cap as fraction of frame dimension.
  # Prevents unrealistic global shifts from noisy estimates.
  botsort_motion_max_translation_frac: 0.25
  # Minimum allowed scale factor for accepted transform.
  # Protects against implausible scene shrink estimates.
  botsort_motion_min_scale: 0.70
  # Maximum allowed scale factor for accepted transform.
  # Protects against implausible scene expansion estimates.
  botsort_motion_max_scale: 1.40
  # Maximum absolute rotation angle (degrees) for valid transform.
  # Rejects extreme rotations likely caused by bad matches.
  botsort_motion_max_rotation_deg: 25.0
  # MAD multiplier used for residual outlier rejection.
  # Larger values keep more points; smaller values are stricter.
  botsort_motion_residual_mad_multiplier: 4.0
  # Minimum residual threshold floor for outlier suppression.
  # Prevents over-tight rejection when residuals are tiny.
  botsort_motion_residual_min_threshold: 18
  # Maximum frame fraction allowed as high-residual area.
  # Exceeding this can mark transform quality as unreliable.
  botsort_motion_residual_max_fraction: 0.22
  # Minimum contour/region area for residual-mask processing.
  # Filters out tiny residual blobs as noise.
  botsort_motion_residual_min_area: 12
  # Dilation size for expanding dynamic residual masks.
  # Increases protected regions around moving foreground objects.
  botsort_motion_dynamic_dilate: 7
  # Frame interval between fresh corner-detection passes.
  # Smaller intervals refresh points more frequently.
  botsort_motion_feature_detect_interval: 2
  # Minimum tracked points before forcing feature re-detection.
  # Maintains sufficient correspondences for robust transforms.
  botsort_motion_min_points_to_redetect: 96
  # Upper bound on active tracked feature points.
  # Caps memory/compute cost of optical-flow tracking.
  botsort_motion_max_track_points: 260
  # Enables dynamic residual masking in motion estimation.
  # Suppresses moving-object regions from GMC fitting.
  botsort_motion_enable_dynamic_mask: true
  # Interval for updating residual statistics/masks.
  # Lower values track scene changes more reactively.
  botsort_motion_residual_update_interval: 2
  # Allows fallback to previous/identity transform on failure.
  # Prevents abrupt breakdown when current fit is invalid.
  botsort_motion_use_fallback_transform: true

  # Enables GMC-based prior injection for normal tracking search.
  # Warps last trusted box with camera motion before search.
  gmc_prior_enabled: true
  # Requires a reliable homography before applying GMC prior.
  # If false, weaker transforms may still influence search.
  gmc_prior_require_reliable_h: true
  # Disables GMC prior application while distractor mode is active.
  # Keeps distractor-mode logic independent from camera prior shifts.
  gmc_prior_skip_in_distractor_mode: true
  # Max allowed GMC prior translation as frame-size fraction.
  # Rejects prior shifts that imply unrealistic global motion.
  gmc_prior_max_translation_frac: 0.25
  # Minimum scale bound for accepted GMC prior transform.
  # Prevents applying priors from extreme shrink transforms.
  gmc_prior_min_scale: 0.70
  # Maximum scale bound for accepted GMC prior transform.
  # Prevents applying priors from extreme expansion transforms.
  gmc_prior_max_scale: 1.40
  # Maximum allowed rotation (degrees) for GMC prior transform.
  # Priors beyond this rotation are treated as unreliable.
  gmc_prior_max_rotation_deg: 25.0
  # Max per-corner displacement fraction for GMC prior validity.
  # Filters priors causing excessive geometric corner movement.
  gmc_prior_max_corner_displacement_frac: 0.25

  # Globally disables camera-motion estimation and compensation logic.
  # When true, tracker uses target motion only without GMC support.
  disable_camera_motion: False
  
  # Logging
  # Enables verbose runtime diagnostics for tracker internals.
  # Useful for debugging, but may increase console/log volume.
  debug: false
