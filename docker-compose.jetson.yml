# =============================================================================
# docker-compose.jetson.yml — convenience wrapper for the Jetson Orin Nano image
#
# Usage on the device:
#       docker compose -f docker-compose.jetson.yml build
#       docker compose -f docker-compose.jetson.yml up -d
#       docker compose -f docker-compose.jetson.yml exec jetson \
#           python3 inference.py test.json public_test submission.csv
#
# Remember to set the L4T_BASE below to the tag that matches your JetPack
# (check with: cat /etc/nv_tegra_release).
# =============================================================================
services:
  jetson:
    build:
      context: .
      dockerfile: Dockerfile.jetson
      args:
        # Match your JetPack version. JetPack 6.x -> r36.x, JetPack 5.x -> r35.x.
        L4T_BASE: dustynv/l4t-pytorch:r36.2.0
    image: siamram-jetson
    # JetPack's NVIDIA container runtime. This is how the container gets access
    # to the Orin Nano's integrated GPU (and the NVDEC hardware decoder). It is
    # the Jetson equivalent of the 'deploy.resources.devices' block used on
    # desktop NVIDIA GPUs.
    runtime: nvidia
    network_mode: host
    # Mount the repo so you can re-run without rebuilding. NOTE: because this
    # overlays the host's files onto /app, the config the container reads is the
    # host's config — so set runtime.use_nvdec there (see JETSON.md).
    volumes:
      - .:/app
    command: ["bash", "-lc", "sleep infinity"]
