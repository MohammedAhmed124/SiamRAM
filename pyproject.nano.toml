[project]
name = "siamram"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
  "albumentations>=2.0.8",
  "coloredlogs>=15.0.1",
  "easydict>=1.13",
  "einops>=0.8.2",
  "fire>=0.7.1",
  "gdown>=6.0.0",
  "got10k>=0.1.3",
  "hydra-core>=1.3.2",
  "imageio>=2.37.3",
  "ipykernel>=7.2.0",
  "ipython>=8.39.0",
  "ipywidgets>=8.1.8",
  "jpeg4py>=0.1.4",
  "lmdb>=2.2.0",
  "matplotlib>=3.10.9",
  #TODO: remove mobile cv
  "mobile-cv>=0.1",
  "numpy>=2.2.6",
  # opencv: NOT installed by uv — JetPack ships a CUDA/GStreamer-enabled OpenCV
  # system-wide. A PyPI opencv-python wheel would shadow it and lose hardware
  # acceleration. The --system-site-packages venv exposes the system build.
  "pandas>=2.3.3",
  "pillow>=12.2.0",
  "pycocotools>=2.0.11",
  "pytorch-toolbelt>=0.8.0",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.7.2",
  "scipy>=1.15.3",
  "shapely>=2.1.2",
  "six>=1.17.0",
  "spikingjelly>=0.0.0.0.14",
  "tensorboard>=2.16.0",
  "tensorboardx>=2.6.5",
  "timm>=1.0.26",
  "torchmetrics>=1.9.0",
  "tqdm>=4.67.3",
  "typing-extensions>=4.15.0",
  "ultralytics>=8.4.41",
  "wandb>=0.26.1",
  # torch / torchvision / torch-tensorrt: NOT installed by uv. JetPack 6.x ships
  # these (and TensorRT/cuDNN) pre-built for the Jetson's CUDA. We reuse them via
  # a --system-site-packages venv rather than re-downloading multi-GB Jetson-index
  # wheels. ultralytics/timm/torchmetrics/pytorch-toolbelt pull torch transitively;
  # since this is installed with `uv pip install` (not `uv sync`), uv treats the
  # system torch as already-satisfied and skips it. See docs/install-nano-system.md.
  # triton: EXCLUDED — no ARM64/aarch64 wheel exists; TensorRT handles kernel
  # compilation on Jetson via the system-installed JetPack TRT libraries.
  # triton-windows: not applicable on Jetson.
  "omegaconf>=2.3.0",
  "torchreid",
  "cython>=3.0.0",
  "h5py>=3.10.0",
  "future>=1.0.0",
  "yacs>=0.1.8",
  "chardet>=5.2.0",
]

# torchreid and mobile-cv build from source. With build isolation disabled they
# compile against the system torch already present in the venv — so they must be
# listed in no-build-isolation-package for uv's two-phase install.
[tool.uv]
no-build-isolation-package = ["torchreid", "mobile-cv"]

[tool.uv.sources]
mobile_cv = { git = "https://github.com/facebookresearch/mobile-vision.git" }
# torch/torchvision/torch-tensorrt are NOT sourced here — they come from the
# system (JetPack) via a --system-site-packages venv. See the dependencies note.
torchreid = { git = "https://github.com/KaiyangZhou/deep-person-reid.git" }

# NOTE: torch/torchvision/torch-tensorrt are intentionally NOT declared as uv
# dependencies or sources here — JetPack provides them system-wide and they are
# exposed to the venv via --system-site-packages. Because the install uses
# `uv pip install --no-build-isolation` (not `uv sync`), uv treats those
# already-installed packages as satisfied and does not re-download Jetson-index
# wheels. There is therefore no [[tool.uv.index]] block and no
# [tool.uv.extra-build-dependencies] table: with build isolation disabled,
# torchreid/mobile-cv build directly against the system torch in the venv, and
# their build deps (cython, numpy, h5py, pillow, ...) are already regular
# dependencies installed before the source builds run.
#
# Install (see docs/install-nano-system.md):
#   cp pyproject.nano.toml pyproject.toml
#   uv venv --system-site-packages
#   uv pip install --no-build-isolation .

[dependency-groups]
dev = [
  "poethepoet>=0.44.0",
  "opencv-stubs>=0.1.3",
  "pandas-stubs>=2.3.3.260113",
  "ruff>=0.15.12",
  "ty>=0.0.32",
]
