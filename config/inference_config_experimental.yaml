# Path to the trained SiamABC checkpoint loaded at startup.
weights_path: "/home/moha/SiamRAM/checkpoints/inference_checkpoint.pth"


# -----------------------------------------------------------------------------
# model: how the SiamABC neural network itself is built.
# -----------------------------------------------------------------------------
model:
  # Python import path of the model class Hydra should instantiate.
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  # Backbone family for the shared feature extractor.
  backbone: custom_fbnet
  # Width multiplier on backbone channels — bigger = more capacity, slower.
  growth_factor: 1.2
  # Upsampling strategy used inside the head/decoder.
  upsample: pixel_shuffle
  # Start from ImageNet pretrained weights for backbone layers that support it.
  pretrained: true
  # Output classes from the prediction head (1 = single-target tracking).
  num_classes: 1
  # Base channel count used by head conv stacks.
  num_filters: 32
  # Input image channels (3 = RGB).
  num_channels: 3
  # Enable an internal feature alignment correction step.
  align: false
  # Image size assumed by preprocessing.
  img_size: 256
  # Net downsampling factor of feature map relative to input.
  stride: 2
  # Conv block flavour used across stages (sep_conv = depthwise separable).
  conv_block: sep_conv
  # Number of stacked tower blocks in the prediction head.
  towernum: 2
  # Preset model size (S / M / L) controlling channel depth.
  model_size: M
  # How many backbone stages to keep — caps depth of feature extraction.
  max_layer: 4
  # Crop template features before fusion (restricts context around target).
  crop_template_features: false
  # Build the auxiliary IoU prediction head on top.
  build_iou_head: true


# -----------------------------------------------------------------------------
# tracker: per-frame SiamABC tracking hyperparameters.
# -----------------------------------------------------------------------------
tracker:
  _target_: models.SiamABC.tracker.SiamABC_Tracker.SiamABCTracker
  # Penalty strength on scale / aspect changes — higher = more conservative.
  penalty_k: 0.062
  # Cosine-window bias on the score map — higher pulls picks toward the centre.
  window_influence: 0.38
  # How fast tracker state catches up to new observations (EMA rate).
  lr: 0.4
  # Window function used for spatial score smoothing.
  windowing: cosine
  # Effective stride mapping score-map cells back to pixels.
  total_stride: 16
  # Score-map spatial resolution (NxN candidate grid).
  score_size: 16
  # Number of proposals scored per update.
  N: 40
  # Allow the dynamic template to evolve across frames.
  dynamic_update: true
  # Use the auxiliary similarity score in candidate ranking.
  similarity_score: false
  # Feature stride used in coordinate math.
  stride: 2
  # Apply extra temporal smoothing on the predicted trajectory.
  smooth: false
  # How strongly the bbox aspect ratio is preserved during updates.
  bbox_ratio: 0.5
  # Offset factor when extracting the template crop around the target centre.
  template_bbox_offset: 0.2
  # Multiplier deciding how much context around target is included in search crop.
  search_context: 2
  # Pixel size of the search crop fed to the model.
  instance_size: 256
  # Pixel size of the template crop.
  template_size: 128
  # Length of the rolling template-memory window.
  memory_window_size: 60
  # Confidence required to admit a new dynamic-template update.
  dynamic_update_threshold: 0.85
  # Lower clamp on the running-confidence smoother.
  running_confidence_floor_value: 0.50
  # IoU required for continuity / quality checks.
  iou_threshold: 0.6
  # First N frames treated as warmup (relaxed gating).
  warmup_frames: 35
  # Window length used by warmup-specific statistics.
  warmup_window_size: 8
  # Multiply candidate scores by predicted IoU quality.
  use_iou_score: false
  # Exponent applied to the IoU score component.
  iou_power: 1.0
  # Reject candidates that fail an IoU consistency gate.
  use_iou_gate: False
  # Apply the IoU gate at final score-pick time.
  use_iou_gate_for_score: false
  # Skip the IoU gate during the first N frames.
  iou_gate_warmup_frames: 20
  # EMA smoothing factor for the IoU gate signal.
  iou_gate_ema_beta: 0.9
  # Use the smoothed gate value instead of the raw per-frame one.
  iou_gate_use_ema: true
  # IoU value below which the gate rejects the candidate.
  iou_gate_threshold: 0.2
  # When uncertain, block the update (true) instead of letting it pass (false).
  iou_gate_fail_closed: false


# Build and run a TensorRT engine instead of plain PyTorch (GPU-only).
make_trt_engine: False


# Which SiamRAM implementation to use ("experiment" enables jump-rejection logic).
ram_tracker_impl: "experiment"


# -----------------------------------------------------------------------------
# ram_tracker_experiment: parameters consumed only by the experimental tracker
# (spike rejection, distractor mode, jump handling).
# -----------------------------------------------------------------------------
ram_tracker_experiment:
  # Master switch for the spike / hard-jump rejection workflow.
  spike_reject_enabled: True
  # Do not run spike checks during the first N tracked frames.
  spike_reject_min_frames: 3
  # Only run spike checks when current tracker score is at least this.
  spike_reject_min_score: 0.0
  # How many past frames to use as the motion baseline.
  spike_reject_history_window: 40
  # Minimum number of history samples needed before spike checks fire.
  spike_reject_min_history: 5

  # A frame is a "spike" when its motion exceeds ratio × baseline.
  spike_reject_ratio: 2.5
  # Plus motion must be at least this absolute normalised amount.
  spike_reject_abs_norm_min: 0.0

  # Motion must drop below this fraction of baseline to count as "settled".
  spike_reject_settle_ratio: 0.7
  # Absolute normalised motion cap during settle validation.
  spike_reject_settle_abs_norm_max: 0.30
  # Consecutive settled frames required before committing the new pick.
  spike_reject_settle_frames: 1
  # Give up the spike-watch after this many frames if no settle happens.
  spike_reject_watch_max_frames: 8
  # Required fractional drop from the spike peak to call it settled.
  spike_reject_settle_from_spike_frac: 0.55

  # Also gate spike decisions on appearance similarity (slower but more reliable).
  spike_reject_use_appearance: false
  # If appearance similarity is above this, treat as still-our-target (no spike).
  spike_reject_max_sim: 0.65

  # Frames to keep distractor mode active after a jump commit.
  jump_reject_distractor_mode_frames: 12
  # Penalise candidates that look like known distractors.
  jump_reject_distractor_penalty_enabled: true
  # Max score reduction the penalty can apply.
  jump_reject_distractor_penalty_weight: 0.25
  # Only apply the penalty when similarity to a distractor is above this floor.
  jump_reject_distractor_penalty_sim_floor: 0.55
  # Only compare against the last K distractor entries.
  jump_reject_distractor_penalty_bank_topk: 5
  # Stay in distractor mode while top similarity remains above this.
  distractor_mode_min_similarity: 0.70
  # Minimum similarity the chosen target must hit during distractor mode.
  distractor_mode_selected_min_similarity: 0.7
  # Max number of YOLO detections scored per frame (0 = all).
  distractor_mode_yolo_topk: 8
  # Max stored target descriptors used for ROI similarity scoring.
  distractor_mode_history_limit: 80
  # Reuse the tracker's crop/mapping size when building the distractor ROI.
  distractor_mode_use_tracker_mapping: true
  # Multiplicative expansion of the YOLO search ROI in distractor mode.
  distractor_mode_roi_expand: 1.20
  # Minimum ROI side length in pixels (prevents tiny crops).
  distractor_mode_roi_min_side: 32

  # DRM ranking weights (distractor mode only).
  # Appearance similarity weight.
  distractor_drm_lam_app: 1.00
  # IoU with expected focus-box weight.
  distractor_drm_lam_iou: 0.25
  # Distance-from-focus penalty weight.
  distractor_drm_lam_dist: 1
  # Weight on the negative-bank (distractor) penalty.
  distractor_drm_gamma: 2
  # Controls how quickly the distance penalty rises with offset.
  distractor_drm_dist_sigma_factor: 2.5
  # Only use the last K distractors when computing the negative penalty.
  distractor_drm_bank_topk: 5
  # Distractor ranking strategy: "ram" = appearance only, "drm" = composite.
  distractor_compare_mode: "ram"

  # Keep admitting to memory while in distractor mode (risk of contamination).
  distractor_mode_update_memory: false
  # Re-init the dynamic template when exiting distractor mode.
  distractor_mode_exit_reinit_enabled: true
  # Consecutive stable frames required to leave distractor mode.
  distractor_mode_exit_stable_frames: 6
  # IoU between consecutive matches needed to call the situation "stable".
  distractor_mode_exit_same_iou: 0.60

  # Maintain a Kalman filter anchor while in distractor mode (motion prior).
  distractor_mode_anchor_ekf_enabled: true
  # Scale extra ROI padding by EKF position uncertainty (0 = disabled).
  distractor_mode_anchor_uncertainty_roi_scale: 0.0
  # Cap on uncertainty-driven extra ROI padding (px).
  distractor_mode_anchor_uncertainty_roi_cap: 96.0

  # Reject candidates motion-inconsistent with the EKF (Mahalanobis gate).
  distractor_mode_mahalanobis_gate_enabled: true
  # Chi-squared threshold for the gate — lower = stricter.
  distractor_mode_mahalanobis_threshold: 9.21
  # Extra measurement variance term (px^2) to soften the gate.
  distractor_mode_mahalanobis_meas_var: 25.0

  # Minimum top1 − top2 score margin needed to switch identity.
  distractor_mode_switch_margin: 0.08
  # Stick with the current pick during this many ambiguous frames.
  distractor_mode_ambiguity_hold_frames: 2
  # Forbid re-entering distractor mode for this many frames after exit.
  distractor_mode_reentry_cooldown_frames: 12
  # Pause memory admissions for this many frames after exiting distractor mode.
  distractor_mode_post_exit_memory_freeze_frames: 8
  # Pause dynamic-template updates for this many frames after exiting.
  distractor_mode_post_exit_template_freeze_frames: 8
  # Behaviour preset for distractor handling ("standard" or alternatives).
  distractor_mode_behavior_mode: "standard"

  # Engage a motion-only lock when the chosen candidate overlaps a distractor heavily.
  distractor_mode_overlap_motion_lock_enabled: true
  # Overlap IoU at which the lock engages.
  distractor_mode_overlap_iou_enter: 0.35
  # Overlap IoU below which the lock is allowed to release.
  distractor_mode_overlap_iou_exit: 0.15
  # Consecutive clear-overlap frames needed before releasing the lock.
  distractor_mode_overlap_clear_frames: 3
  # Hard maximum number of frames the lock can stay engaged.
  distractor_mode_overlap_lock_max_frames: 24

  # Penalise candidates far from the current target focus.
  distractor_focus_dist_penalty_enabled: true
  # Max score reduction the focus-distance penalty can apply.
  distractor_focus_dist_penalty_weight: 0.35
  # Inside this normalised radius the penalty is zero.
  distractor_focus_dist_soft_radius: 0.60
  # Beyond this normalised radius the penalty is fully applied.
  distractor_focus_dist_hard_radius: 2.00

  # If true, enter occlusion mode immediately after a jump commit instead of distractor mode.
  jump_reject_force_occlusion: false


# -----------------------------------------------------------------------------
# ram_tracker_subsystems: nested config layout (preferred for new keys).
# Both this nested layout and the flat ram_tracker block below are honoured.
# -----------------------------------------------------------------------------
ram_tracker_subsystems:
  # Appearance descriptor backend used for re-identification.
  descriptor:
    # Which descriptor model to use: "osnet" or "siamese".
    backend: "osnet"
    # OSNet variant name (only used when backend == "osnet").
    osnet_model_name: "osnet_x1_0"
    # Which OSNet pretrained weights to load.
    osnet_pretrained_checkpoint: "reid_market1501"
    # Optional path to a local OSNet checkpoint (overrides the preset above).
    osnet_model_path: ""
    # Device used by OSNet — "auto" picks CUDA when available.
    osnet_device: "auto"
    # Max candidates passed into the descriptor model per call (0 = unlimited).
    osnet_max_candidate_batch: 5

  # Reacquisition (exiting occlusion) thresholds.
  reacquisition:
    # Confidence required to accept a reacquisition.
    threshold: 0.75
    # Consecutive frames over threshold needed to confirm reacquisition.
    confirm_frames: 5
    # Stricter Siam-branch threshold used during occlusion recovery.
    occ_siam_threshold: 0.8

  # Spike rejection (nested mirror of ram_tracker_experiment values).
  spike_reject:
    # Master switch for spike rejection.
    enabled: true
    # Don't run spike checks during the first N tracked frames.
    min_frames: 3
    # Only check spikes when score is at least this.
    min_score: 0.0
    # Frames of motion history used as baseline.
    history_window: 40
    # Minimum history samples needed before spike checks fire.
    min_history: 5
    # A frame is a spike when motion > ratio × baseline.
    ratio: 2.5
    # Also require this minimum absolute normalised motion.
    abs_norm_min: 0.0
    # Also gate on appearance similarity, not only motion.
    use_appearance: false
    # Above this similarity, treat as still-our-target (no spike).
    max_sim: 0.65
    # Watch for at most this many frames before giving up the spike workflow.
    watch_max_frames: 8
    # Settle thresholds — when motion drops, how do we call it stabilized?
    settle:
      # Motion must drop below this fraction of baseline.
      ratio: 0.7
      # Absolute normalised motion cap during settle.
      abs_norm_max: 0.30
      # Consecutive settled frames required to commit.
      frames: 1
      # Required fractional drop from the spike peak.
      from_spike_frac: 0.55

  # GMC (Global Motion Compensation) prior — warps last bbox with camera motion before search.
  gmc_prior:
    # Turn the prior on.
    enabled: true
    # Only apply when the homography is reliable.
    require_reliable_h: true
    # Skip the prior while in distractor mode.
    skip_in_distractor_mode: true
    # Max translation as a fraction of frame size (sanity bound).
    max_translation_frac: 0.25
    # Minimum scale bound for an accepted prior.
    min_scale: 0.70
    # Maximum scale bound for an accepted prior.
    max_scale: 1.40
    # Maximum rotation (degrees) before the prior is rejected.
    max_rotation_deg: 25.0
    # Max per-corner displacement as fraction of frame size.
    max_corner_displacement_frac: 0.25


# -----------------------------------------------------------------------------
# trt_engine: TensorRT-only options (used when make_trt_engine == True).
# -----------------------------------------------------------------------------
trt_engine:
  # Test-time-augmentation blend factor inside the TRT wrapper.
  lambda_tta: 0.1
  # Enable FP16 precision for TensorRT engine build + execution.
  fp16: True
  # GPU device index to build / run on.
  cuda_id: 0


# -----------------------------------------------------------------------------
# ram_tracker: legacy flat layout — most knobs live here.
# These are the live values consumed by SiamRAMExperimentTracker.
# -----------------------------------------------------------------------------
ram_tracker:
  # Path to the YOLO weights file used for detection / re-detection.
  yolo_weights: "checkpoints/yolo11n.pt"
  # Minimum YOLO detection confidence to keep.
  yolo_conf: 0.3
  # Restrict YOLO outputs to the inferred target class.
  yolo_filter_class: false
  # Number of frames used during YOLO class-vote warmup.
  yolo_class_detect_frames: 5
  # Enable compiled YOLO execution path (faster if available).
  copile_yolo: False

  # Appearance descriptor backend: "osnet" or "siamese".
  descriptor_backend: "osnet"
  # Only used for the siamese backend — pick SiamABC layer: "neck" (~256-d) or "encoder" (~1024-d).
  siamese_feature_source: "neck"
  # Only used for the siamese backend — comparison style: "xcorr" (2D cross-correlation) or "pooled" (cosine).
  siamese_comparison_mode: "xcorr"
  # OSNet variant name (torchreid model registry).
  osnet_model_name: "osnet_x1_0"
  # OSNet pretrained weights preset to load.
  osnet_pretrained_checkpoint: "reid_market1501"
  # Optional local OSNet weights path (overrides preset above).
  osnet_model_path: ""
  # Device used by OSNet — "auto" picks CUDA when available.
  osnet_device: "auto"
  # Max candidates passed to OSNet per call (0 = unlimited).
  osnet_max_candidate_batch: 5

  # Tracker confidence considered reliable for normal updates.
  conf_threshold: 0.50
  # Confidence required to accept detector-driven reacquisition.
  reacq_threshold: 0.75
  # Consecutive frames above reacq_threshold needed to confirm.
  reacq_confirm_frames: 5
  # Stricter Siam-branch threshold to exit occlusion.
  occ_siam_reacq_threshold: 0.8
  # Minimum appearance match needed to accept an identity (1.0 disables this gate).
  app_match_threshold: 1
  # Required margin between top candidates during occlusion handling.
  occ_siam_margin: 0.8
  # Blend factor for small corrective nudges to predicted state (0 = disabled).
  nudge_alpha: 0.0
  # Consecutive low-confidence frames before declaring occlusion entry.
  entry_patience: 1
  # Auto-enter occlusion mode on target loss.
  enter_occlusion_on_loss: True
  # Block entering distractor mode under heavy camera motion.
  block_distractor_mode_on_camera_motion: True
  # Block entering occlusion mode under heavy camera motion.
  block_occlusion_on_camera_motion: True
  # Pixel displacement threshold classifying camera motion as "heavy".
  camera_motion_heavy_disp_threshold: 15.0
  # Resolution-normalised displacement threshold for heavy camera motion.
  camera_motion_heavy_norm_threshold: 0.35
  # Force early-occlusion behaviour when entry occurs before this frame index (-1 = disabled).
  early_occlusion_entry_n_frames: -1
  # Legacy frame-duration flag for early-occlusion behaviour (-1 = disabled).
  early_occlusion_max_frames: -1
  # Use RAM matching until the DRM bank is full, then switch to DRM.
  occlusion_use_ram_until_drm_full: False
  # Warmup frames using a centered ROI (0 = disabled).
  yolo_warmup_frames: 0
  # Center-crop scale during YOLO warmup.
  yolo_warmup_center_scale: 0.4
  # Cap on the long edge of processed frames (px).
  max_proc_long_edge: 1280

  # How many frames of YOLO candidates to collect before final DRM scoring.
  cand_collection_frames: 1
  # Similarity threshold for DRM admission / promotion.
  drm_tau_sim: 0.6
  # Minimum support count required to promote a DRM memory entry.
  drm_mmin: 3
  # Maximum entries stored in the DRM bank.
  drm_capacity: 50
  # Required margin for accepting the DRM winner.
  drm_margin: 0.8
  # Skip DRM updates when quality score is above this (likely uninformative).
  drm_skip_threshold: 23
  # Number of top candidates evaluated per DRM step.
  drm_top_k: 3
  # Global suppressor weight in DRM scoring (0 = disabled).
  drm_gamma: 0

  # DRM composite ranking weights (each weight scales one score component).
  # Appearance similarity weight.
  drm_lam_app: 1
  # Candidate-velocity consistency weight.
  drm_lam_cand_vel: 0.0
  # Spatial distance penalty weight.
  drm_lam_dist: 0.0
  # Candidate direction consistency weight.
  drm_lam_cand_dir: 0.0
  # Temporal recency weight — favours fresher observations.
  drm_lam_time: 0.3
  # IoU overlap weight in the composite score.
  drm_lam_iou: 0.0
  # Motion-model agreement weight in DRM scoring.
  drm_lam_mot: 0.0

  # Minimum speed below which velocity-based scores are not trusted.
  vel_score_min_speed: 0.5
  # Hard direction-mismatch threshold (reject candidates with worse alignment).
  vel_dir_hard_gate: 0.4
  # Window length for averaged velocity estimation.
  velocity_window_average: 200

  # Capacity of the RAM appearance memory bank.
  mem_capacity: 50
  # Exponential decay applied to older historical confidences.
  history_decay: 0.1
  # Rolling length of the confidence history buffer.
  conf_history_len: 200
  # Rolling length of the bbox-size history buffer.
  size_history_len: 200
  # Number of most-recent history points excluded from certain checks (avoids transient bias).
  history_skip_last: 8
  # Maximum lookback for shrinkage analysis.
  shrinkage_max_lookback: 30

  # Initial ROI padding (px) around the predicted box during YOLO search.
  roi_start_expand: 20
  # Base expansion (px) of the YOLO search crop.
  yolo_search_expand: 100
  # Multiplicative growth factor when ROI keeps missing.
  search_expand_growth_factor: 1.4
  # Number of misses between consecutive ROI growth steps.
  search_expand_growth_every: 150
  # Hard maximum ROI expansion (px) to keep things bounded.
  search_expand_max: 500.0

  # Box-area fraction below which target is treated as "tiny / long-distance".
  long_distance_area_fraction: 0.030
  # Initial ROI expansion for tiny-target recovery (px).
  tiny_roi_start_expand: 8.0
  # Base YOLO expansion for tiny-target mode (px).
  tiny_yolo_search_expand: 20.0
  # Growth factor for tiny-target ROI expansion.
  tiny_search_expand_growth_factor: 1.3
  # Frames between tiny-target growth steps.
  tiny_search_expand_growth_every: 50
  # Maximum tiny-mode ROI expansion (px).
  tiny_search_expand_max: 40.0

  # Camera-motion estimator: "classic" (fast) | "accurate" | "botsort" (BoT-SORT-inspired).
  homography_mode: "classic"
  # BoT-SORT motion transform family: "partial_affine" | "full_affine" | "homography".
  botsort_motion_model: "partial_affine"
  # Downscale factor before feature tracking (lower = faster, less detail).
  botsort_motion_work_scale: 0.65
  # Padding fraction around bbox for building dynamic exclusion masks.
  botsort_motion_bbox_pad: 0.50
  # Grid rows for distributing corner detection across the frame.
  botsort_motion_grid_rows: 5
  # Grid columns for corner-detection distribution.
  botsort_motion_grid_cols: 7
  # Maximum corners per grid cell.
  botsort_motion_max_corners_per_cell: 16
  # Shi-Tomasi corner-quality cutoff.
  botsort_motion_quality_level: 0.01
  # Minimum spacing (px) between detected corners.
  botsort_motion_min_distance: 7
  # Neighbourhood block size used for corner-quality computation.
  botsort_motion_block_size: 7
  # Lucas-Kanade optical-flow window size (px).
  botsort_motion_lk_win_size: 17
  # Optical-flow pyramid depth (higher = larger motion handled).
  botsort_motion_lk_max_level: 2
  # Forward-backward error threshold for filtering noisy point matches.
  botsort_motion_fb_max_error: 1.5
  # RANSAC reprojection error threshold (px).
  botsort_motion_ransac_reproj_threshold: 3.0
  # RANSAC target confidence level.
  botsort_motion_ransac_confidence: 0.99
  # Maximum RANSAC iterations per transform estimate.
  botsort_motion_ransac_max_iters: 1500
  # Minimum number of inliers required to accept the fit.
  botsort_motion_min_inliers: 24
  # Minimum inlier ratio required to accept the fit.
  botsort_motion_min_inlier_ratio: 0.35
  # Maximum median residual allowed for accepted transforms.
  botsort_motion_max_median_residual: 4.0
  # Minimum number of grid cells with inliers (forces spatial spread).
  botsort_motion_min_coverage_cells: 5
  # Maximum global translation as fraction of frame size (sanity bound).
  botsort_motion_max_translation_frac: 0.25
  # Minimum allowed scale factor for accepted transforms.
  botsort_motion_min_scale: 0.70
  # Maximum allowed scale factor for accepted transforms.
  botsort_motion_max_scale: 1.40
  # Maximum allowed rotation (degrees) for accepted transforms.
  botsort_motion_max_rotation_deg: 25.0
  # MAD-multiplier used in residual-based outlier rejection.
  botsort_motion_residual_mad_multiplier: 4.0
  # Floor for residual-rejection threshold (prevents over-tight rejection on noise).
  botsort_motion_residual_min_threshold: 18
  # Max fraction of the frame that can be flagged as high-residual.
  botsort_motion_residual_max_fraction: 0.22
  # Minimum contour area (px) for residual-mask processing.
  botsort_motion_residual_min_area: 12
  # Dilation size (px) applied to dynamic residual masks.
  botsort_motion_dynamic_dilate: 7
  # Frame interval between fresh corner-detection passes.
  botsort_motion_feature_detect_interval: 2
  # Minimum tracked points before forcing a feature re-detection.
  botsort_motion_min_points_to_redetect: 96
  # Hard cap on the number of active feature points.
  botsort_motion_max_track_points: 260
  # Enable dynamic residual masking inside motion estimation.
  botsort_motion_enable_dynamic_mask: true
  # Frame interval between residual-mask updates.
  botsort_motion_residual_update_interval: 2
  # Allow falling back to the previous / identity transform on failure.
  botsort_motion_use_fallback_transform: true

  # GMC prior — warps the last reliable box with camera motion before tracker search.
  # Master switch for the GMC prior.
  gmc_prior_enabled: true
  # Only apply the prior when the homography passed reliability gates.
  gmc_prior_require_reliable_h: true
  # Skip the prior while in distractor mode (keeps that logic camera-motion-independent).
  gmc_prior_skip_in_distractor_mode: true
  # Max translation as frame fraction allowed in the prior.
  gmc_prior_max_translation_frac: 0.25
  # Minimum scale bound for accepted prior transforms.
  gmc_prior_min_scale: 0.70
  # Maximum scale bound for accepted prior transforms.
  gmc_prior_max_scale: 1.40
  # Maximum rotation (degrees) for accepted prior transforms.
  gmc_prior_max_rotation_deg: 25.0
  # Max per-corner displacement fraction for the prior to remain valid.
  gmc_prior_max_corner_displacement_frac: 0.25

  # Globally disable camera-motion estimation and compensation (debug switch).
  disable_camera_motion: False

  # Print verbose diagnostics from the tracker internals.
  debug: false
