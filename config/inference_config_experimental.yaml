# Path to the trained SiamABC checkpoint loaded at startup.
weights_path: "/home/moha/SiamRAM/checkpoints/inference_checkpoint.pth"

# =============================================================================
# trt_engine: all TensorRT / FP16 options (GPU-only), grouped in one place.
# =============================================================================
trt_engine:
  # TRT-compile the SiamABC backbone. Master switch for the SiamABC engine.
  trt_compile_siamabc: False
  # Legacy precision fallback used only when backbone_mode is left empty.
  fp16: True
  # SiamABC backbone implementation. Keep dynamic_fp16 until the parity
  # benchmark proves another mode meets the deployment GPU's latency budget.
  # Options: dynamic_fp16, static_fp16, static_fp16_fp32_neck, dynamic_fp32.
  backbone_mode: "dynamic_fp16"
  # Diagnostic control for dynamic_fp32. False preserves TensorRT's TF32 default.
  backbone_disable_tf32: False
  # OSNet-only descriptor acceleration. Ignored unless descriptor_backend == "osnet".
  trt_compile_osnet: False
  # OSNet-only FP16 descriptor inference. Ignored unless descriptor_backend == "osnet".
  osnet_fp16: True
  # OSNet-only async overlap. Pixel descriptors are CPU-only and synchronous.
  osnet_async_overlap: True
  # Test-time-augmentation blend factor inside the SiamABC TRT wrapper.
  lambda_tta: 0.1
  # GPU device index to build / run engines on.
  cuda_id: 0

# Which SiamRAM implementation to use. Kept for backwards compatibility;
# run_inference currently always uses SiamRAMExperimentTracker.
ram_tracker_impl: "experiment"

# =============================================================================
# runtime: process-level PyTorch switches.
# =============================================================================
runtime:
  # Let cuDNN autotune convolution kernels. Faster for fixed shapes, but less
  # predictable for variable ROI crops and can slightly perturb eager behavior.
  cudnn_benchmark: false


# =============================================================================
# model: how the SiamABC neural network itself is built.
# =============================================================================
model:
  # Python import path of the model class Hydra should instantiate.
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  # Start from ImageNet pretrained weights for backbone layers that support it.
  pretrained: False
  # Conv block flavour used across stages (sep_conv = depthwise separable).
  conv_block: sep_conv
  # Number of stacked tower blocks in the prediction head.
  towernum: 2
  # Preset model size (S / M / L) controlling channel depth.
  model_size: M
  # How many backbone stages to keep — caps depth of feature extraction.
  max_layer: 4
  # Build the auxiliary IoU prediction head on top.
  build_iou_head: False


# =============================================================================
# tracker: per-frame SiamABC tracking hyperparameters.
# =============================================================================
tracker:
  _target_: models.SiamABC.tracker.SiamABC_Tracker.SiamABCTracker

  architectural_config:
    # Pixel stride between neighbouring score-grid cells.
    score_grid_stride: 16
    # Score-grid side length (16 means a 16x16 candidate grid).
    score_grid_size: 16
    # Offset factor when extracting the template crop around the target centre.
    template_context_padding: 0.2
    # Multiplier deciding how much context around target is included in search crop.
    search_context_scale: 2
    # Pixel size of the search crop fed to the model.
    search_crop_size: 256
    # Pixel size of the template crop.
    template_crop_size: 128

  hanning_window_penalty:
    # Master switch for blending a Hanning/cosine prior into the score map.
    enabled: False
    # "cosine" builds the spatial prior window used by SiamABC.
    window_type: cosine
    # Blend amount for the Hanning prior.
    influence: 0.25
    # Apply scale/aspect consistency penalty before the Hanning blend.
    size_penalty_enabled: false
    # Strength of the scale/aspect penalty.
    size_penalty_k: 0.04
    # Apply extra temporal smoothing on the predicted trajectory.
    bbox_size_smoothing_enabled: false
    # Learning-rate multiplier used only when bbox_size_smoothing_enabled is true.
    bbox_size_smoothing_lr: 0.3

  dynamic_template:
    # Allow the dynamic template to evolve across frames.
    enabled: true
    # Frames between dynamic-template re-selection during steady-state tracking.
    update_interval: 40
    # Number of recent confident frames kept for dynamic-template selection.
    memory_window: 30
    # Confidence required before a frame can enter the dynamic-template memory.
    admit_conf_threshold: 0.83
    # Lower clamp on the running-confidence smoother.
    running_confidence_floor: 0.50
    # IoU required between consecutive boxes before admitting a template update.
    admit_iou_threshold: 0.6
    # First frames treated as template warm-up.
    warmup_frames: 6
    # Frames between dynamic-template re-selection during warm-up.
    warmup_update_interval: 2
    # During warm-up, consider only this many recent memory entries.
    warmup_memory_window: 8
    # Veto dynamic-template admission from transiently blurry target crops.
    blur_gate_enabled: True
    # Candidate sharpness must be at least reference / ratio; sharper crops pass.
    # Example: 1.25 rejects crops more than 20% blurrier than the sharpness EMA.
    blur_gate_ratio: 1.3
    # EMA smoothing for the sharpness reference.
    blur_gate_ema_alpha: 1
    # Update the blur reference only from frames actually selected as dynamic templates.
    # False preserves legacy behavior: update on every blur-gate admission candidate.
    blur_gate_update_ema_on_selected_only: True


# =============================================================================
# ram_tracker: SiamRAM config (grouped, single source of truth).
# All experimental knobs now live here; no duplicate subsystem blocks.
# Leaf key names intentionally match tracker kwargs for compatibility.
# =============================================================================
ram_tracker:

  # ---------------------------------------------------------------------------
  # runtime: general-purpose switches.
  # ---------------------------------------------------------------------------
  runtime:
    # Print verbose diagnostics from the tracker (useful when debugging).
    debug: False
    # Downscale every input frame so its long edge is at most this many px (keeps things fast on big videos).
    max_proc_long_edge: 10000

  # ---------------------------------------------------------------------------
  # yolo: re-detector used for occlusion recovery.
  # ---------------------------------------------------------------------------
  yolo:
    # Which YOLO checkpoint to load for re-detection.
    yolo_weights: "checkpoints/yolo11n.pt"
    # Drop any YOLO box whose confidence is below this (lower = more candidates, more noise).
    yolo_conf: 0.3
    # Side length YOLO downsamples each crop to (bigger = better on tiny targets, slower).
    yolo_imgsz: 640
    # Run YOLO with test-time augmentation (flips + multi-scale). Higher recall, ~3-4× slower.
    yolo_augment: false
    # After class-vote warmup, keep only detections matching the inferred target class.
    yolo_filter_class: false
    # How many of the first frames are used to vote on what class the target is.
    yolo_class_detect_frames: 5
    # Use the compiled (TensorRT) YOLO engine if available.
    copile_yolo: false
    # For this many initial frames, run YOLO on a centered crop instead of the regular ROI (0 = off).
    yolo_warmup_frames: 0
    # How big that centered warmup crop is, as a fraction of the frame.
    yolo_warmup_center_scale: 0.4
    # Base padding (px) added around the predicted box before running YOLO.
    yolo_search_expand: 100

  # ---------------------------------------------------------------------------
  # descriptor: which appearance model is used for re-ID & DRM ranking.
  # ---------------------------------------------------------------------------
  descriptor:
    # Which appearance model:
    #   "osnet"             = strong person re-ID, slower.
    #   "siamese"           = reuse SiamABC features.
    #   "pixel descriptors" = legacy grayscale+HSV descriptor from commit 3f01ab9, fastest.
    descriptor_backend: "osnet"
    # If siamese: which layer to pool the embedding from ("neck" ~256-d, "encoder" ~1024-d).
    siamese_feature_source: "neck"
    # If siamese: how to compare embeddings.
    #   "xcorr"      = 2D cross-correlation peak (translation-tolerant; SiamABC-native).
    #   "pooled"     = global-avg-pool to a vector, then cosine (spatial info discarded).
    #   "similarity" = flatten the whole feature map to a vector, then cosine
    #                  (keeps spatial detail, but no translation tolerance).
    siamese_comparison_mode: "similarity"
    # Which OSNet variant to use.
    osnet_model_name: "osnet_x0_25"
    # Which OSNet pretrained weights preset to load ("" = use default).
    osnet_pretrained_checkpoint: ""
    # Optional local OSNet weights file (overrides the preset above).
    osnet_model_path: ""
    # Where OSNet runs ("auto" picks CUDA if available, otherwise CPU).
    osnet_device: "auto"
    # Cap on candidates passed into OSNet per call (0 = no cap).
    osnet_max_candidate_batch: 5
    # NOTE: OSNet FP16 / TRT compilation are configured under the top-level
    # `trt_engine` block (osnet_fp16, trt_compile_osnet).
    # How often the descriptor backend runs on the per-frame normal-tracking
    # memory-admission path. 1 = every confident frame (default). N>1 only
    # extracts/admits a descriptor every Nth frame to save compute during stable
    # tracking. Occlusion-recovery descriptor calls are unaffected.
    descriptor_stride: 2

  # ---------------------------------------------------------------------------
  # template_drm_gate: gate dynamic-template admission on DRM-bank fit.
  # ---------------------------------------------------------------------------
  template_drm_gate:
    # Master switch. false = inner score/IoU gates only.
    # Restored to baseline (944f2b8): baseline had no DRM template-admit gate.
    dynamic_template_drm_admit_enabled: True
    # Composite DRM score needed to refresh the dynamic template. "auto" reuses
    # the live drm_margin:auto value; if drm_margin is numeric, falls back to 0.50.
    dynamic_template_drm_admit_margin: auto

  # NOTE: normal-tracking loss-detection knobs (conf_threshold, entry_patience,
  # entry_patience_high_motion, enter_occlusion_on_loss, nudge_alpha) now live
  # under occlusion.entry below, grouped with the recovery phase they trigger.

  # ---------------------------------------------------------------------------
  # camera_motion: estimating and reacting to the camera moving between frames.
  # ---------------------------------------------------------------------------
  camera_motion:
    core:
      # Which estimator: "classic" (fast) or "accurate" (slower).
      homography_mode: "classic"
      # Hard-off switch for all camera-motion estimation (debug only).
      disable_camera_motion: False

    # When the camera is shaking a lot, optionally skip occlusion entry
    # to avoid false triggers caused by the camera moving rather than the target.
    gating:
      # Block occlusion entry when camera motion is heavy (avoids fake target-loss from shake).
      block_occlusion_on_camera_motion: false
      # Camera moved more than this many px in one frame = "heavy".
      camera_motion_heavy_disp_threshold: 20.0
      # Camera moved more than this fraction of bbox diagonal = "heavy" (matters for tiny targets).
      camera_motion_heavy_norm_threshold: 0.3

  # ---------------------------------------------------------------------------
  # gmc_prior: warp the previous bbox forward by camera motion so SiamABC
  # searches from the right starting point when only the camera moved.
  # ---------------------------------------------------------------------------
  gmc_prior:
    # Use the camera-motion warp as a search prior at all.
    gmc_prior_enabled: true
    # Only apply when the homography passed reliability checks.
    gmc_prior_require_reliable_h: true
    # Reject the prior if it implies more than this fraction of frame translation.
    gmc_prior_max_translation_frac: 0.25
    # Reject if implied camera zoom-out is below this factor.
    gmc_prior_min_scale: 0.7
    # Reject if implied camera zoom-in is above this factor.
    gmc_prior_max_scale: 1.4
    # Reject if implied rotation exceeds this many degrees.
    gmc_prior_max_rotation_deg: 25.0
    # Reject if any frame corner moves more than this fraction of the frame.
    gmc_prior_max_corner_displacement_frac: 0.25

  # ---------------------------------------------------------------------------
  # roi_search: where YOLO looks for re-detection candidates.
  # ---------------------------------------------------------------------------
  roi_search:
    # Standard-size targets.
    normal:
      # Initial padding (px) added around the predicted box when starting the search.
      roi_start_expand: 20
      # Each time YOLO keeps missing, multiply the ROI by this factor.
      search_expand_growth_factor: 1.4
      # How many misses between consecutive ROI growth steps.
      search_expand_growth_every: 150
      # Hard cap on the ROI padding (prevents unbounded growth).
      search_expand_max: 500.0

    # Tiny / long-distance targets (different params because small targets need tighter ROIs).
    tiny:
      # If the bbox is smaller than this fraction of the frame, treat as "tiny".
      long_distance_area_fraction: 0.03
      # Initial ROI padding (px) for tiny-target recovery.
      tiny_roi_start_expand: 8.0
      # Base YOLO expansion (px) for tiny mode.
      tiny_yolo_search_expand: 20.0
      # Growth factor for tiny-target ROI expansion.
      tiny_search_expand_growth_factor: 1.3
      # How many misses between tiny-target growth steps.
      tiny_search_expand_growth_every: 150
      # Hard cap on tiny-mode ROI expansion (px).
      tiny_search_expand_max: 40.0

    # When the target has left the frame entirely.
    out_of_frame:
      # Pin the ROI to the edge the target exited from, instead of centering on prediction.
      out_of_frame_roi_edge_pin_enabled: true
      # Use the tiny-target ROI params even after the target leaves (off = always use normal).
      out_of_frame_roi_use_tiny_params: false
      # Stop searching once predicted centre is this many object-widths past the edge.
      out_of_frame_roi_skip_when_past_edge_mult: 2.0
      # Out-of-frame overrides for the four expansion knobs (each <= 0 = fall back to normal/tiny).
      out_of_frame_roi_start_expand: -1.0
      out_of_frame_yolo_search_expand: -1.0
      out_of_frame_search_expand_growth_factor: -1.0
      out_of_frame_search_expand_growth_every: -1

    # Periodic exploration burst: every Nth occlusion frame, widen the search ROI
    # for that single frame to N-times its normal size (applied past search_expand_max),
    # then snap back. Cheap way to occasionally cast a wider net without paying the
    # cost every frame. Applies to normal, tiny, and out-of-frame ROIs.
    explore_burst:
      # Master switch for the periodic burst.
      occ_explore_burst_enabled: True
      # Stride N: fire the burst every Nth occlusion frame.
      occ_explore_burst_every: 20
      # ROI expansion multiplier applied on a burst frame.
      occ_explore_burst_mult: 2.0

    # Provisional emission: during occlusion, instead of emitting a zero bbox,
    # emit a best-guess box (the most plausible YOLO detection, else the EKF
    # held_box) so the track stays continuous and shows as a red box in the viz
    # until recovery is verified. NOTE: this also changes the emitted track in
    # submission output, not just the visualization — A/B it before committing.
    provisional_emit:
      # Master switch. When false, occlusion frames emit a zero bbox (legacy).
      occ_emit_provisional: True
      # How to pick the box: "nearest" (appearance-weighted closest YOLO
      # detection to the EKF held_box) or "held" (always the EKF held_box).
      occ_provisional_select: nearest

  # ---------------------------------------------------------------------------
  # memory_history: rolling buffers used by occlusion recovery & analysis.
  # ---------------------------------------------------------------------------
  memory_history:
    # Max stored target appearance descriptors (the "RAM" memory bank).
    mem_capacity: 50
    # How fast older confidence values fade.
    history_decay: 0.1
    # Length of the rolling confidence history.
    conf_history_len: 200
    # Length of the rolling bbox-size history.
    size_history_len: 200
    # Skip the N most-recent samples when doing certain checks (avoids transient bias).
    history_skip_last: 8
    # Max frames back we look when checking if the target is shrinking.
    shrinkage_max_lookback: 30

  # ---------------------------------------------------------------------------
  # occlusion: the lost-target recovery lifecycle, organized BY PHASE so you can
  # tune one stage in one place. Flow:
  #   entry (loss declared)
  #     -> [detectability_probe verdict, decided earlier in normal tracking]
  #     -> phase0_siam  -> phase1_collect -> phase2_final_drm
  #     -> reacquire_confirm -> commit / exit
  # The loader flattens every leaf below to a tracker kwarg by its leaf-key name,
  # so this nesting is purely organizational (no behavioral effect).
  # ---------------------------------------------------------------------------
  occlusion:

    # === ENTRY: when a low SiamABC score is declared a real loss and we switch
    # from normal tracking into occlusion recovery. ===
    entry:
      # SiamABC score below this means the target is probably lost. "auto" maps
      # the healthy tracking-score EMA onto the output range below.
      # Restored to baseline (944f2b8) fixed value; auto knobs below stay dormant.
      # conf_threshold: auto
      # conf_threshold_auto_in_min: 0.60
      # conf_threshold_auto_in_max: 0.95
      # conf_threshold_auto_out_min: 0.4
      # conf_threshold_auto_out_max: 0.6
      # conf_threshold_auto_ema_alpha: 0.1
      # conf_threshold_auto_warmup: 0.50
      # conf_threshold_auto_n_frames: 1
      # conf_threshold_auto_min_samples: 1


      conf_threshold: auto
      conf_threshold_auto_in_min: 0.60
      conf_threshold_auto_in_max: 1
      conf_threshold_auto_out_min: 0.4
      conf_threshold_auto_out_max: 0.75
      conf_threshold_auto_ema_alpha: 0.01
      conf_threshold_auto_warmup: 0.50
      conf_threshold_auto_n_frames: 1
      conf_threshold_auto_min_samples: 1
      # How many consecutive low-score frames before declaring occlusion entry.
      entry_patience: 1
      # Alternate entry patience used only while camera motion is heavy (same signal
      # as camera_motion gating). Lets you wait longer before declaring loss during
      # fast pans (a transient low score is often just the tracker lagging, not real
      # occlusion). -1 = disabled (always use entry_patience). NOTE: only takes
      # effect if block_occlusion_on_camera_motion is False — with blocking ON the
      # entry streak is reset every heavy frame, so it never reaches any patience.
      entry_patience_high_motion: 1
      # Should we even go into occlusion mode when SiamABC reports loss.
      enter_occlusion_on_loss: True
      # Grace period: never enter occlusion during the first N frames (warm-up).
      # Low scores while the dynamic template is still settling are ignored, and
      # the entry streak is held at 0 so it cannot fire the instant the window
      # ends. 0 = no restriction.
      no_occlusion_first_n_frames: 18
      # Small corrective blend toward the predicted state when drifting (0 = off).
      nudge_alpha: 0.0

    # === DETECTABILITY PROBE: a class-agnostic check (run EARLY in normal
    # tracking, not during occlusion) of whether YOLO can see the target at all.
    # Its verdict selects the recovery strategy:
    #   detectable     -> skip the phase-0 SiamABC-alone commit; rely on
    #                     phase1_collect + phase2_final_drm (YOLO + DRM).
    #   not detectable -> also skip the phase-0 SiamABC-at-EKF seed; rely on
    #                     YOLO collection + DRM but run YOLO at the lower
    #                     yolo_undetectable_conf so the (sub-threshold) target
    #                     still surfaces candidate boxes for DRM to rank. ===
    detectability_probe:
      # Master switch. When false, occlusion recovery behaves exactly as before.
      yolo_detectability_enabled: False
      # N: how many YOLO probe attempts to run during early tracking.
      yolo_detectability_probe_attempts: 12
      # Frames between probe attempts. Probe spans ~ attempts x stride frames,
      # so this knob controls how long the detectability check takes.
      yolo_detectability_probe_stride: 10
      # Hits (probes that land a box on the target) needed to call it detectable.
      yolo_detectability_min_hits: 1
      # IoU with the tracked box for a YOLO detection to count as a hit.
      yolo_detectability_iou_thr: 0.3
      # YOLO confidence used ONLY during occlusion candidate collection for a
      # target the probe found NOT detectable. Lower than yolo_conf so the
      # otherwise sub-threshold target still produces boxes for DRM to rank.
      # The probe itself always uses the normal yolo_conf. Unset -> yolo_conf.
      yolo_undetectable_conf: 0.08

    # === PHASE 0 — SIAM: the cheap fast path. Seed SiamABC in the search ROI and,
    # if it clears Gate A (occ_siam_reacq_threshold) AND Gate B (the DRM accept
    # threshold app_match_threshold), reacquire immediately. All three knobs
    # below are read ONLY by occ_phase_siam. ===
    phase0_siam:
      # Gate A — SiamABC score needed to attempt a phase-0 reacquisition.
      # "auto" = adapt per video: EMA of the live SiamABC confidence (the same
      # signal reacq_threshold:auto learns) minus delta, clamped to [min, max],
      # but with its own, deliberately stricter band. A number keeps the fixed
      # value and ignores every occ_siam_reacq_threshold_auto_* knob below.
      occ_siam_reacq_threshold: auto
      # --- adaptive knobs (only used when occ_siam_reacq_threshold == "auto") ---
      occ_siam_reacq_threshold_auto_min: 0.65
      occ_siam_reacq_threshold_auto_max: 0.8
      occ_siam_reacq_threshold_auto_delta: 0.05
      occ_siam_reacq_threshold_auto_ema_alpha: 0.2
      occ_siam_reacq_threshold_auto_n_frames: 10
      occ_siam_reacq_threshold_auto_warmup: 0.80
      occ_siam_reacq_threshold_auto_min_samples: 5
      # Required margin between top-1 and top-2 candidates during occlusion.
      occ_siam_margin: 0.0
      # Gate B — minimum DRM composite score to accept the phase-0 reacquisition.
      # Higher tightens the appearance check; 0 effectively disables this gate.
      # "auto" = adapt per video: EMA of the genuine target's DRM composite
      # self-score (the same signal drm_margin:auto learns) minus delta, clamped
      # to [min, max]. A number keeps the fixed legacy value and ignores every
      # app_match_threshold_auto_* knob below.
      app_match_threshold: auto
      # --- adaptive knobs (only used when app_match_threshold == "auto") ---
      app_match_threshold_auto_min: 0.55
      app_match_threshold_auto_max: 0.80
      app_match_threshold_auto_delta: 0.10
      app_match_threshold_auto_ema_alpha: 0.2
      app_match_threshold_auto_n_frames: 10
      app_match_threshold_auto_warmup: 0.72
      app_match_threshold_auto_min_samples: 5

    # === PHASE 1 — COLLECT: gather YOLO candidates (+ appearance descriptors)
    # across consecutive frames so per-candidate velocity becomes measurable. ===
    phase1_collect:
      # Collect YOLO candidates across this many frames before final scoring.
      cand_collection_frames: 1

    # === PHASE 2 — FINAL DRM: velocity-trace the collected candidates, rank them
    # with the composite DRM score, then verify the top-k with SiamABC. ===
    phase2_final_drm:

      # DRM (composite candidate ranking) used during occlusion recovery.
      drm:
        # Appearance similarity needed to admit a candidate into the DRM bank.
        drm_tau_sim: 0.75
        # Minimum support count required to promote a bank entry.
        drm_mmin: 3
        # Max entries in the DRM bank.
        drm_capacity: 50
        # Required margin between the DRM winner and runner-up.
        # "auto" = adapt per video: EMA of the genuine target's own composite
        # self-score, minus delta, clamped to [min, max]. A number (e.g. 0.58)
        # keeps the fixed legacy behavior and ignores every drm_margin_auto_* knob.
        drm_margin: auto
        # --- adaptive margin knobs (only used when drm_margin == "auto") ---
        # Lower clamp: the tuned margin never drops below this.
        drm_margin_auto_min: 0.5
        # Upper clamp: the tuned margin never rises above this.
        drm_margin_auto_max: 0.76
        # How far below the EMA the margin sits (bigger = more permissive / catches more).
        drm_margin_auto_delta: 0.05
        # EMA smoothing of the self-score (higher = reacts faster, noisier).
        drm_margin_auto_ema_alpha: 0.3
        # Sample the target self-score every N confident frames.
        drm_margin_auto_n_frames: 10
        # Margin used before enough samples accrue (acts as a fixed warmup margin).
        drm_margin_auto_warmup: 0.70
        # Samples required before the margin starts adapting away from warmup.
        drm_margin_auto_min_samples: 5
        # Skip the DRM update if quality score is already this high.
        drm_skip_threshold: 23
        # Number of top candidates evaluated per DRM step.
        drm_top_k: 3
        # How per-anchor DRM scores collapse into one candidate score:
        # "max"  = best-matching anchor wins (legacy behaviour).
        # "mean" = average across anchors (optionally only the top-k below).
        drm_score_aggregation: "mean"
        # For "mean": average only the top-k highest-scoring anchors.
        # null (or <= 0) averages every anchor (global mean).
        # Ignored when drm_score_aggregation is "max".
        drm_score_aggregation_topk: 3
        # Global suppressor weight (0 = off).
        drm_gamma: 0
        # Weight on appearance similarity in the composite score.
        drm_lam_app: 1
        # Weight on spatial distance penalty.
        drm_lam_dist: 0.0
        # Weight on candidate-direction consistency.
        drm_lam_cand_dir: 0.0
        # Weight on temporal recency (newer = better).
        drm_lam_time: 0.0
        # Weight on IoU overlap.
        drm_lam_iou: 0.0
        # Weight on motion-model agreement.
        drm_lam_mot: 0.0

      # Velocity-based scoring that feeds the DRM cand_vel / cand_dir terms above.
      velocity:
        # Below this speed, don't trust velocity-based scoring.
        vel_score_min_speed: 0.5
        # Hard direction-mismatch cutoff (above = reject candidate).
        vel_dir_hard_gate: 0.4
        # How many frames are averaged when estimating velocity.
        velocity_window_average: 200

    # === REACQUIRE-CONFIRM: after a candidate verifies, optionally require N
    # consecutive confident frames before committing the exit from occlusion. ===
    reacquire_confirm:
      # SiamABC score needed to accept "yes, I found the target again". "auto"
      # sets the bar to EMA(score)-delta clamped to the range below.
      # Restored to baseline (944f2b8) fixed value; auto knobs below stay dormant.
      # reacq_threshold: auto
      # reacq_threshold_auto_min: 0.7
      # reacq_threshold_auto_max: 0.8
      # reacq_threshold_auto_delta: 0.05
      # reacq_threshold_auto_ema_alpha: 0.2
      # reacq_threshold_auto_n_frames: 1
      # reacq_threshold_auto_warmup: 0.70
      # reacq_threshold_auto_min_samples: 1


      reacq_threshold: auto
      reacq_threshold_auto_min: 0.7
      reacq_threshold_auto_max: 0.8
      reacq_threshold_auto_delta: 0.05
      reacq_threshold_auto_ema_alpha: 0.02
      reacq_threshold_auto_n_frames: 1
      reacq_threshold_auto_warmup: 0.70
      reacq_threshold_auto_min_samples: 1
      # How many consecutive frames must clear that threshold before committing.
      reacq_confirm_frames: 1

    # === POLICY: higher-level recovery behavior spanning the whole episode. ===
    policy:
      # If occlusion starts before this frame index, use a special "early" recovery mode (-1 = off).
      early_occlusion_entry_n_frames: -1
      # Legacy duration cap on early-occlusion mode (-1 = off).
      early_occlusion_max_frames: -1
      # Stick with appearance-only matching until the DRM bank fills up.
      occlusion_use_ram_until_drm_full: false
