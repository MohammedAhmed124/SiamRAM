data:
  # CSV built by build_dataset_index.py (stored in the persistent named volume).
  csv_path: "training_data/train_dataframe.csv"
  seed: 42

tracking:
  template_size: 128
  instance_size: 256
  score_size: 16
  search_context: 2
  max_frame_gap: 130
  total_stride: 16
  template_bbox_offset: 0.2
  search_image_shift: 0.6
  search_image_scale: 0.3
  template_image_shift: 0.01
  template_image_scale: 0.01
  occlusion_aug_prob: 0.0
  occlusion_min_area: 0.04
  occlusion_max_area: 0.11
  occlusion_max_patches: 2
  search_blur_prob: 0.15
  search_jpeg_prob: 0.15
  # Hard-negative sampling probabilities.
  neg_cross_seq_prob: 0.55
  neg_same_class_prob: 0.75
  neg_shifted_prob: 0.40

dataset:
  train_num_samples: 8000
  train_neg_ratio: 0.65      # 65% negatives - same as Medium run
  val_num_samples: 800
  val_neg_ratio: 0.5
  val_split_ratio: 0.1

dataloader:
  train_batch_size: 32
  val_batch_size: 32
  num_workers: 4

model:
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  # SiamABC-Tiny: FBNet backbone, no correlation-level attention.
  weights_path: "checkpoints/model_S_Tiny_v1.pt"
  backbone: custom_fbnet
  # FBNet has no online pretrained weights - must be false for model_size S.
  pretrained: false
  num_channels: 3
  align: false
  img_size: 256
  stride: 2
  conv_block: sep_conv
  towernum: 2
  model_size: S              # S = Tiny
  max_layer: 4
  build_simsiam_heads: false
  build_iou_head: true

training:
  num_epochs: 25
  start_epoch: 1
  train_mode: cls_head_only
  stage1_epochs: 0
  stage1_mode: cls_head_only
  stage2_mode: cls_head_only
  stage2_warmup_epochs: 0
  backbone_lr: 0.0
  head_lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  eta_min: 1.0e-6
  batch_level_logs: true
  log_every: 10

loss:
  cls_weight: 1.0
  bbox_weight: 1.0           # zeroed automatically in cls_head_only mode
  iou_weight: 1.0            # zeroed automatically in cls_head_only mode
  focal_alpha: 0.25
  focal_gamma: 2.0

output:
  # Under /app/training/ which is the bind-mounted project dir ->
  # directly accessible on the host at:
  # C:\Users\afara\PycharmProjects\SiamRAM-master\training\checkpoints\cls_hardneg_tiny_run1\
  checkpoint_dir: "training/checkpoints/cls_hardneg_tiny_run1/"
