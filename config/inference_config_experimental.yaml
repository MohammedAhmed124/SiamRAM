# Path to the trained SiamABC checkpoint loaded at startup.
weights_path: "/home/moha/SiamRAM/checkpoints/inference_checkpoint.pth"

# Build and run a TensorRT engine instead of plain PyTorch (GPU-only).
make_trt_engine: False

# Which SiamRAM implementation to use ("experiment" enables jump-rejection logic).
ram_tracker_impl: "experiment"


# =============================================================================
# model: how the SiamABC neural network itself is built.
# =============================================================================
model:
  # Python import path of the model class Hydra should instantiate.
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  # Backbone family for the shared feature extractor.
  backbone: custom_fbnet
  # Width multiplier on backbone channels — bigger = more capacity, slower.
  growth_factor: 1.2
  # Upsampling strategy used inside the head/decoder.
  upsample: pixel_shuffle
  # Start from ImageNet pretrained weights for backbone layers that support it.
  pretrained: true
  # Output classes from the prediction head (1 = single-target tracking).
  num_classes: 1
  # Base channel count used by head conv stacks.
  num_filters: 32
  # Input image channels (3 = RGB).
  num_channels: 3
  # Enable an internal feature alignment correction step.
  align: false
  # Image size assumed by preprocessing.
  img_size: 256
  # Net downsampling factor of feature map relative to input.
  stride: 2
  # Conv block flavour used across stages (sep_conv = depthwise separable).
  conv_block: sep_conv
  # Number of stacked tower blocks in the prediction head.
  towernum: 2
  # Preset model size (S / M / L) controlling channel depth.
  model_size: M
  # How many backbone stages to keep — caps depth of feature extraction.
  max_layer: 4
  # Crop template features before fusion (restricts context around target).
  crop_template_features: false
  # Build the auxiliary IoU prediction head on top.
  build_iou_head: true


# =============================================================================
# tracker: per-frame SiamABC tracking hyperparameters.
# =============================================================================
tracker:
  _target_: models.SiamABC.tracker.SiamABC_Tracker.SiamABCTracker
  # Penalty strength on scale / aspect changes — higher = more conservative.
  penalty_k: 0.062
  # Cosine-window bias on the score map — higher pulls picks toward the centre.
  window_influence: 0.38
  # How fast tracker state catches up to new observations (EMA rate).
  lr: 0.4
  # Window function used for spatial score smoothing.
  windowing: cosine
  # Effective stride mapping score-map cells back to pixels.
  total_stride: 16
  # Score-map spatial resolution (NxN candidate grid).
  score_size: 16

  # Allow the dynamic template to evolve across frames.
  dynamic_update: true
  # Use the auxiliary similarity score in candidate ranking.
  similarity_score: false
  # Feature stride used in coordinate math.
  stride: 2
  # Apply extra temporal smoothing on the predicted trajectory.
  smooth: false
  # How strongly the bbox aspect ratio is preserved during updates.
  bbox_ratio: 0.5
  # Offset factor when extracting the template crop around the target centre.
  template_bbox_offset: 0.2
  # Multiplier deciding how much context around target is included in search crop.
  search_context: 2
  # Pixel size of the search crop fed to the model.
  instance_size: 256
  # Pixel size of the template crop.
  template_size: 128
  # Number of proposals scored per update.
  N: 40
  # Length of the rolling template-memory window.
  memory_window_size: 30
  # Confidence required to admit a new dynamic-template update.
  dynamic_update_threshold: 0.80
  # Lower clamp on the running-confidence smoother.
  running_confidence_floor_value: 0.50
  # IoU required for continuity / quality checks.
  iou_threshold: 0.6
  # First N frames treated as warmup (relaxed gating).
  warmup_frames: 35
  # Window length used by warmup-specific statistics.
  warmup_window_size: 8
  # Multiply candidate scores by predicted IoU quality.
  use_iou_score: false
  # Exponent applied to the IoU score component.
  iou_power: 1.0
  # Reject candidates that fail an IoU consistency gate.
  use_iou_gate: False
  # Apply the IoU gate at final score-pick time.
  use_iou_gate_for_score: false
  # Skip the IoU gate during the first N frames.
  iou_gate_warmup_frames: 20
  # EMA smoothing factor for the IoU gate signal.
  iou_gate_ema_beta: 0.9
  # Use the smoothed gate value instead of the raw per-frame one.
  iou_gate_use_ema: true
  # IoU value below which the gate rejects the candidate.
  iou_gate_threshold: 0.2
  # When uncertain, block the update (true) instead of letting it pass (false).
  iou_gate_fail_closed: false


# =============================================================================
# trt_engine: TensorRT-only options (used when make_trt_engine == True).
# =============================================================================
trt_engine:
  # Test-time-augmentation blend factor inside the TRT wrapper.
  lambda_tta: 0.1
  # Enable FP16 precision for TensorRT engine build + execution.
  fp16: True
  # GPU device index to build / run on.
  cuda_id: 0


# =============================================================================
# ram_tracker: SiamRAM config (grouped, single source of truth).
# All experimental knobs now live here; no duplicate subsystem blocks.
# Leaf key names intentionally match tracker kwargs for compatibility.
# =============================================================================
ram_tracker:

  # ---------------------------------------------------------------------------
  # runtime: general-purpose switches.
  # ---------------------------------------------------------------------------
  runtime:
    # Print verbose diagnostics from the tracker (useful when debugging).
    debug: false
    # Downscale every input frame so its long edge is at most this many px (keeps things fast on big videos).
    max_proc_long_edge: 1280

  # ---------------------------------------------------------------------------
  # yolo: re-detector used for occlusion recovery and distractor mode.
  # ---------------------------------------------------------------------------
  yolo:
    # Which YOLO checkpoint to load for re-detection.
    yolo_weights: "checkpoints/yolo11n.pt"
    # Drop any YOLO box whose confidence is below this (lower = more candidates, more noise).
    yolo_conf: 0.30
    # Side length YOLO downsamples each crop to (bigger = better on tiny targets, slower).
    yolo_imgsz: 320
    # Run YOLO with test-time augmentation (flips + multi-scale). Higher recall, ~3-4× slower.
    yolo_augment: false
    # After class-vote warmup, keep only detections matching the inferred target class.
    yolo_filter_class: false
    # How many of the first frames are used to vote on what class the target is.
    yolo_class_detect_frames: 5
    # Use the compiled (TensorRT) YOLO engine if available.
    copile_yolo: false
    # For this many initial frames, run YOLO on a centered crop instead of the regular ROI (0 = off).
    yolo_warmup_frames: 0
    # How big that centered warmup crop is, as a fraction of the frame.
    yolo_warmup_center_scale: 0.4
    # Base padding (px) added around the predicted box before running YOLO.
    yolo_search_expand: 100

  # ---------------------------------------------------------------------------
  # descriptor: which appearance model is used for re-ID & DRM ranking.
  # ---------------------------------------------------------------------------
  descriptor:
    # Which appearance model: "osnet" (strong person re-ID) or "siamese" (reuse SiamABC features, faster).
    descriptor_backend: "osnet"
    # If siamese: which layer to pool the embedding from ("neck" ~256-d, "encoder" ~1024-d).
    siamese_feature_source: "neck"
    # If siamese: how to compare embeddings ("xcorr" = 2D cross-correlation, "pooled" = cosine).
    siamese_comparison_mode: "xcorr"
    # Which OSNet variant to use.
    osnet_model_name: "osnet_x1_0"
    # Which OSNet pretrained weights preset to load ("" = use default).
    osnet_pretrained_checkpoint: ""
    # Optional local OSNet weights file (overrides the preset above).
    osnet_model_path: ""
    # Where OSNet runs ("auto" picks CUDA if available, otherwise CPU).
    osnet_device: "auto"
    # Cap on candidates passed into OSNet per call (0 = no cap).
    osnet_max_candidate_batch: 5

  # NOTE: normal-tracking loss-detection knobs (conf_threshold, entry_patience,
  # entry_patience_high_motion, enter_occlusion_on_loss, nudge_alpha) now live
  # under occlusion.entry below, grouped with the recovery phase they trigger.

  # ---------------------------------------------------------------------------
  # camera_motion: estimating and reacting to the camera moving between frames.
  # ---------------------------------------------------------------------------
  camera_motion:
    core:
      # Which estimator: "classic" (fast), "accurate" (slower), or "botsort" (BoT-SORT-inspired).
      homography_mode: "classic"
      # Hard-off switch for all camera-motion estimation (debug only).
      disable_camera_motion: false

    # BoT-SORT options — only consulted when homography_mode == "botsort".
    botsort:
      # Transform family: "partial_affine", "full_affine", or "homography".
      botsort_motion_model: "partial_affine"
      # Downscale factor before feature tracking (lower = faster, less detail).
      botsort_motion_work_scale: 0.65
      # Padding fraction around the target bbox when building the dynamic exclusion mask.
      botsort_motion_bbox_pad: 0.5
      # Grid rows used to distribute corner detection across the frame.
      botsort_motion_grid_rows: 5
      # Grid columns for corner-detection distribution.
      botsort_motion_grid_cols: 7
      # Max corners detected per grid cell.
      botsort_motion_max_corners_per_cell: 16
      # Shi-Tomasi corner-quality cutoff (lower = more corners, noisier).
      botsort_motion_quality_level: 0.01
      # Minimum spacing (px) between detected corners.
      botsort_motion_min_distance: 7
      # Neighbourhood block size used for corner-quality scoring.
      botsort_motion_block_size: 7
      # Lucas-Kanade optical-flow window size (px).
      botsort_motion_lk_win_size: 17
      # Pyramid depth — higher tolerates larger frame-to-frame motion.
      botsort_motion_lk_max_level: 2
      # Forward-backward consistency error threshold to filter bad matches.
      botsort_motion_fb_max_error: 1.5
      # RANSAC reprojection error threshold (px).
      botsort_motion_ransac_reproj_threshold: 3.0
      # RANSAC target confidence level.
      botsort_motion_ransac_confidence: 0.99
      # Max RANSAC iterations per transform estimate.
      botsort_motion_ransac_max_iters: 1500
      # Minimum number of inliers required to accept the fit.
      botsort_motion_min_inliers: 24
      # Minimum inlier ratio required to accept the fit.
      botsort_motion_min_inlier_ratio: 0.35
      # Max median residual allowed for an accepted transform.
      botsort_motion_max_median_residual: 4.0
      # Minimum number of grid cells with inliers (forces spatial spread).
      botsort_motion_min_coverage_cells: 5
      # Reject the fit if implied translation exceeds this fraction of the frame.
      botsort_motion_max_translation_frac: 0.25
      # Reject if implied camera zoom-out is below this factor.
      botsort_motion_min_scale: 0.7
      # Reject if implied camera zoom-in is above this factor.
      botsort_motion_max_scale: 1.4
      # Reject if implied rotation exceeds this many degrees.
      botsort_motion_max_rotation_deg: 25.0
      # MAD multiplier used in residual-based outlier rejection.
      botsort_motion_residual_mad_multiplier: 4.0
      # Floor for residual rejection threshold (prevents over-tight cuts on quiet frames).
      botsort_motion_residual_min_threshold: 18
      # Max fraction of frame flagged as high-residual before bailing out.
      botsort_motion_residual_max_fraction: 0.22
      # Minimum contour area (px) considered in residual-mask processing.
      botsort_motion_residual_min_area: 12
      # Dilation size (px) applied to the dynamic residual mask.
      botsort_motion_dynamic_dilate: 7
      # How many frames between fresh corner-detection passes.
      botsort_motion_feature_detect_interval: 2
      # Re-detect features when active points drop below this count.
      botsort_motion_min_points_to_redetect: 96
      # Hard cap on the number of active feature points.
      botsort_motion_max_track_points: 260
      # Enable dynamic residual masking inside motion estimation.
      botsort_motion_enable_dynamic_mask: true
      # Frame interval between residual-mask updates.
      botsort_motion_residual_update_interval: 2
      # When the fit fails, fall back to the previous (or identity) transform.
      botsort_motion_use_fallback_transform: true

    # When the camera is shaking a lot, optionally skip distractor/occlusion entry
    # to avoid false triggers caused by the camera moving rather than the target.
    gating:
      # Block distractor-mode entry when camera motion is heavy (avoids false jumps from shake).
      block_distractor_mode_on_camera_motion: True
      # Block occlusion entry when camera motion is heavy (avoids fake target-loss from shake).
      block_occlusion_on_camera_motion: false
      # Camera moved more than this many px in one frame = "heavy".
      camera_motion_heavy_disp_threshold: 15.0
      # Camera moved more than this fraction of bbox diagonal = "heavy" (matters for tiny targets).
      camera_motion_heavy_norm_threshold: 0.2

    # While camera motion is heavy, optionally swap the SiamABC dynamic-template
    # update params (re-selection cadence N + memory window length) and revert
    # when it calms. Useful to let the template adapt faster (smaller window/N)
    # during fast pans, or be steadier. Reuses the same heavy-motion signal as
    # the gating block above (camera_motion_heavy_disp/norm thresholds).
    template_adapt:
      # Master switch. false = always use the base tracker.N / memory_window_size
      # (zero behavior change; the heavy-motion signal isn't even computed early).
      camera_motion_template_adapt_enabled: True
      # select_representatives() cadence (dynamic template re-picked every N frames) under heavy motion.
      camera_motion_high_N: 5
      # Memory window length (frames kept for dynamic-template selection) under heavy motion.
      # Shrinking drops the oldest memory frames; deques are rebuilt only on an actual change.
      camera_motion_high_memory_window_size: 5
      # Dynamic-template ADMISSION GATES under heavy motion (-1 = leave unchanged).
      # Score gate: min confidence to admit a dynamic-template update. Raising it
      # under motion avoids learning blurred/low-quality templates during pans.
      camera_motion_high_dynamic_update_threshold: 0.5
      # Continuity gate: min IoU(pred, prev) to admit an update. Raising it under
      # motion rejects large jumpy boxes; lowering it tolerates fast displacement.
      camera_motion_high_iou_threshold: 0.5
      # Keep the high-motion behavior above lingering for this many frames after
      # camera motion calms, before reverting to base (handles the brief blur /
      # settle right after a pan ends). 0 = revert the instant motion drops.
      camera_motion_template_adapt_linger_frames: 30

  # ---------------------------------------------------------------------------
  # gmc_prior: warp the previous bbox forward by camera motion so SiamABC
  # searches from the right starting point when only the camera moved.
  # ---------------------------------------------------------------------------
  gmc_prior:
    # Use the camera-motion warp as a search prior at all.
    gmc_prior_enabled: true
    # Only apply when the homography passed reliability checks.
    gmc_prior_require_reliable_h: true
    # Skip the prior while in distractor mode (keeps that logic camera-motion-independent).
    gmc_prior_skip_in_distractor_mode: true
    # Reject the prior if it implies more than this fraction of frame translation.
    gmc_prior_max_translation_frac: 0.25
    # Reject if implied camera zoom-out is below this factor.
    gmc_prior_min_scale: 0.7
    # Reject if implied camera zoom-in is above this factor.
    gmc_prior_max_scale: 1.4
    # Reject if implied rotation exceeds this many degrees.
    gmc_prior_max_rotation_deg: 25.0
    # Reject if any frame corner moves more than this fraction of the frame.
    gmc_prior_max_corner_displacement_frac: 0.25

  # ---------------------------------------------------------------------------
  # roi_search: where YOLO looks for re-detection candidates.
  # ---------------------------------------------------------------------------
  roi_search:
    # Standard-size targets.
    normal:
      # Initial padding (px) added around the predicted box when starting the search.
      roi_start_expand: 20
      # Each time YOLO keeps missing, multiply the ROI by this factor.
      search_expand_growth_factor: 1.4
      # How many misses between consecutive ROI growth steps.
      search_expand_growth_every: 150
      # Hard cap on the ROI padding (prevents unbounded growth).
      search_expand_max: 500.0

    # Tiny / long-distance targets (different params because small targets need tighter ROIs).
    tiny:
      # If the bbox is smaller than this fraction of the frame, treat as "tiny".
      long_distance_area_fraction: 0.03
      # Initial ROI padding (px) for tiny-target recovery.
      tiny_roi_start_expand: 8.0
      # Base YOLO expansion (px) for tiny mode.
      tiny_yolo_search_expand: 20.0
      # Growth factor for tiny-target ROI expansion.
      tiny_search_expand_growth_factor: 1.3
      # How many misses between tiny-target growth steps.
      tiny_search_expand_growth_every: 150
      # Hard cap on tiny-mode ROI expansion (px).
      tiny_search_expand_max: 40.0

    # When the target has left the frame entirely.
    out_of_frame:
      # Pin the ROI to the edge the target exited from, instead of centering on prediction.
      out_of_frame_roi_edge_pin_enabled: true
      # Use the tiny-target ROI params even after the target leaves (off = always use normal).
      out_of_frame_roi_use_tiny_params: false
      # Stop searching once predicted centre is this many object-widths past the edge.
      out_of_frame_roi_skip_when_past_edge_mult: 2.0
      # Out-of-frame overrides for the four expansion knobs (each <= 0 = fall back to normal/tiny).
      out_of_frame_roi_start_expand: -1.0
      out_of_frame_yolo_search_expand: -1.0
      out_of_frame_search_expand_growth_factor: -1.0
      out_of_frame_search_expand_growth_every: -1

  # ---------------------------------------------------------------------------
  # memory_history: rolling buffers used by occlusion recovery & analysis.
  # ---------------------------------------------------------------------------
  memory_history:
    # Max stored target appearance descriptors (the "RAM" memory bank).
    mem_capacity: 50
    # How fast older confidence values fade.
    history_decay: 0.1
    # Length of the rolling confidence history.
    conf_history_len: 200
    # Length of the rolling bbox-size history.
    size_history_len: 200
    # Skip the N most-recent samples when doing certain checks (avoids transient bias).
    history_skip_last: 8
    # Max frames back we look when checking if the target is shrinking.
    shrinkage_max_lookback: 30

  # ---------------------------------------------------------------------------
  # occlusion: the lost-target recovery lifecycle, organized BY PHASE so you can
  # tune one stage in one place. Flow:
  #   entry (loss declared)
  #     -> [detectability_probe verdict, decided earlier in normal tracking]
  #     -> phase0_siam  -> phase1_collect -> phase2_final_drm
  #     -> reacquire_confirm -> commit / exit
  # The loader flattens every leaf below to a tracker kwarg by its leaf-key name,
  # so this nesting is purely organizational (no behavioral effect).
  # ---------------------------------------------------------------------------
  occlusion:

    # === ENTRY: when a low SiamABC score is declared a real loss and we switch
    # from normal tracking into occlusion recovery. ===
    entry:
      # SiamABC score below this means the target is probably lost.
      conf_threshold: 0.5
      # How many consecutive low-score frames before declaring occlusion entry.
      entry_patience: 1
      # Alternate entry patience used only while camera motion is heavy (same signal
      # as camera_motion gating). Lets you wait longer before declaring loss during
      # fast pans (a transient low score is often just the tracker lagging, not real
      # occlusion). -1 = disabled (always use entry_patience). NOTE: only takes
      # effect if block_occlusion_on_camera_motion is False — with blocking ON the
      # entry streak is reset every heavy frame, so it never reaches any patience.
      entry_patience_high_motion: 3
      # Should we even go into occlusion mode when SiamABC reports loss.
      enter_occlusion_on_loss: True
      # Small corrective blend toward the predicted state when drifting (0 = off).
      nudge_alpha: 0.0

    # === DETECTABILITY PROBE: a class-agnostic check (run EARLY in normal
    # tracking, not during occlusion) of whether YOLO can see the target at all.
    # Its verdict selects the recovery strategy:
    #   detectable     -> skip the phase-0 SiamABC-alone commit; rely on
    #                     phase1_collect + phase2_final_drm (YOLO + DRM).
    #   not detectable -> rely solely on phase0_siam (keep retrying SiamABC);
    #                     YOLO collection is skipped since it cannot find it. ===
    detectability_probe:
      # Master switch. When false, occlusion recovery behaves exactly as before.
      yolo_detectability_enabled: true
      # N: how many YOLO probe attempts to run during early tracking.
      yolo_detectability_probe_attempts: 6
      # Frames between probe attempts. Probe spans ~ attempts x stride frames,
      # so this knob controls how long the detectability check takes.
      yolo_detectability_probe_stride: 3
      # Hits (probes that land a box on the target) needed to call it detectable.
      yolo_detectability_min_hits: 1
      # IoU with the tracked box for a YOLO detection to count as a hit.
      yolo_detectability_iou_thr: 0.3

    # === PHASE 0 — SIAM: the cheap fast path. Seed SiamABC in the search ROI and,
    # if it clears Gate A (occ_siam_reacq_threshold) AND Gate B (the DRM accept
    # threshold app_match_threshold), reacquire immediately. All three knobs
    # below are read ONLY by occ_phase_siam. ===
    phase0_siam:
      # Gate A — SiamABC score needed to attempt a phase-0 reacquisition.
      occ_siam_reacq_threshold: 0.8
      # Required margin between top-1 and top-2 candidates during occlusion.
      occ_siam_margin: 0.5
      # Gate B — minimum DRM composite score to accept the phase-0 reacquisition.
      # Higher tightens the appearance check; 0 effectively disables this gate.
      app_match_threshold: 0.6

    # === PHASE 1 — COLLECT: gather YOLO candidates (+ appearance descriptors)
    # across consecutive frames so per-candidate velocity becomes measurable. ===
    phase1_collect:
      # Collect YOLO candidates across this many frames before final scoring.
      cand_collection_frames: 1

    # === PHASE 2 — FINAL DRM: velocity-trace the collected candidates, rank them
    # with the composite DRM score, then verify the top-k with SiamABC. ===
    phase2_final_drm:

      # DRM (composite candidate ranking) used during occlusion recovery.
      drm:
        # Appearance similarity needed to admit a candidate into the DRM bank.
        drm_tau_sim: 0.65
        # Minimum support count required to promote a bank entry.
        drm_mmin: 3
        # Max entries in the DRM bank.
        drm_capacity: 20
        # Required margin between the DRM winner and runner-up.
        drm_margin: 0.6
        # Skip the DRM update if quality score is already this high.
        drm_skip_threshold: 23
        # Number of top candidates evaluated per DRM step.
        drm_top_k: 3
        # Global suppressor weight (0 = off).
        drm_gamma: 0
        # Weight on appearance similarity in the composite score.
        drm_lam_app: 1
        # Weight on candidate-velocity consistency.
        drm_lam_cand_vel: 0.0
        # Weight on spatial distance penalty.
        drm_lam_dist: 0.0
        # Weight on candidate-direction consistency.
        drm_lam_cand_dir: 0.0
        # Weight on temporal recency (newer = better).
        drm_lam_time: 0.0
        # Weight on IoU overlap.
        drm_lam_iou: 0.0
        # Weight on motion-model agreement.
        drm_lam_mot: 0.0

      # Separate occlusion-recovery DRM ranking weights, used ONLY when occlusion
      # was entered via the distractor below-gate force path
      # (distractor_mode_selected_below_gate_force_occlusion). This is a full,
      # independent set used wholesale — it does not inherit from drm: above, so
      # keep both in sync where you want them equal. The shared bank params
      # (tau_sim / mmin / capacity) and the accept threshold (app_match_threshold)
      # are NOT duplicated here. Seeded to mirror drm: above (no behavior change
      # until you tune it); e.g. raise distractor_occ_drm_lam_dist to bias recovery
      # away from the nearby distractor the tracker just lost the target to.
      distractor_occ_drm:
        # Required margin between the DRM winner and runner-up.
        distractor_occ_drm_margin: 0.7
        # Skip the DRM update if quality score is already this high.
        distractor_occ_drm_skip_threshold: 23
        # Number of top candidates evaluated per DRM step.
        distractor_occ_drm_top_k: 3
        # Temporal decay rate.
        distractor_occ_drm_alpha: 0.05
        # Global suppressor weight (0 = off).
        distractor_occ_drm_gamma: 0
        # Weight on appearance similarity in the composite score.
        distractor_occ_drm_lam_app: 1
        # Weight on spatial distance penalty (raise to avoid re-locking the distractor).
        distractor_occ_drm_lam_dist: 0.0
        # Weight on candidate-direction consistency.
        distractor_occ_drm_lam_cand_dir: 0.0
        # Weight on temporal recency (newer = better).
        distractor_occ_drm_lam_time: 0.0
        # Weight on IoU overlap.
        distractor_occ_drm_lam_iou: 0.0
        # Weight on motion-model agreement.
        distractor_occ_drm_lam_mot: 0.0
        # Scales the Gaussian distance sigma by max(obj_w, obj_h).
        distractor_occ_drm_dist_sigma_factor: 2.5

      # Velocity-based scoring that feeds the DRM cand_vel / cand_dir terms above.
      velocity:
        # Below this speed, don't trust velocity-based scoring.
        vel_score_min_speed: 0.5
        # Hard direction-mismatch cutoff (above = reject candidate).
        vel_dir_hard_gate: 0.4
        # How many frames are averaged when estimating velocity.
        velocity_window_average: 200

    # === REACQUIRE-CONFIRM: after a candidate verifies, optionally require N
    # consecutive confident frames before committing the exit from occlusion. ===
    reacquire_confirm:
      # SiamABC score needed to accept "yes, I found the target again".
      reacq_threshold: 0.5
      # How many consecutive frames must clear that threshold before committing.
      reacq_confirm_frames: 1

    # === POLICY: higher-level recovery behavior spanning the whole episode. ===
    policy:
      # If occlusion starts before this frame index, use a special "early" recovery mode (-1 = off).
      early_occlusion_entry_n_frames: -1
      # Legacy duration cap on early-occlusion mode (-1 = off).
      early_occlusion_max_frames: -1
      # Stick with appearance-only matching until the DRM bank fills up.
      occlusion_use_ram_until_drm_full: false

  # ---------------------------------------------------------------------------
  # spike_reject: detect "the tracker just jumped to a distractor" — one-frame
  # large displacement compared to the recent baseline.
  # ---------------------------------------------------------------------------
  spike_reject:
    # Master switch for the spike / hard-jump rejection workflow.
    spike_reject_enabled: False
    # Don't run spike detection in the first N frames (startup noise).
    spike_reject_min_frames: 3
    # Only run when current tracker score is at least this.
    spike_reject_min_score: 0.0
    # How many past frames define the "normal" motion baseline.
    spike_reject_history_window: 40
    # Need at least this many baseline samples before spike detection fires.
    spike_reject_min_history: 5
    # A frame counts as a spike when its motion is at least this × the baseline.
    spike_reject_ratio: 2.5
    # Plus the motion must reach this absolute (bbox-diagonal-normalised) amount.
    spike_reject_abs_norm_min: 0.0
    # After a spike, motion must drop below this × baseline to count as "settled".
    spike_reject_settle_ratio: 0.7
    # Absolute cap on motion during the settle phase.
    spike_reject_settle_abs_norm_max: 0.3
    # How many consecutive settled frames before committing to distractor mode.
    spike_reject_settle_frames: 1
    # Give up the spike-watch after this many frames if it never settles.
    spike_reject_watch_max_frames: 8
    # During settle, motion must drop to at least this fraction of the spike peak.
    spike_reject_settle_from_spike_frac: 0.55
    # Also check appearance similarity when deciding if the spike is a real switch.
    spike_reject_use_appearance: false
    # If appearance similarity is above this, treat as still-our-target (no spike).
    spike_reject_max_sim: 0.65
    # Require this many consecutive spike-triggering frames before starting the watch
    # (1 = react immediately; >1 suppresses single-frame jitter but blocks real one-frame jumps).
    spike_reject_confirm_frames: 1
    # Stricter absolute floor when target is tiny — kills false positives caused
    # by tiny bbox diagonals amplifying small camera residuals into huge step-norms.
    spike_reject_long_distance_abs_norm_min: 0.0
    # Treat the apparent jump as ego-motion noise when the residual is smaller than
    # this × the raw camera motion at the target point (0 = off).
    spike_reject_camera_residual_min_ratio: 0
    # Hard-disable spike detection whenever the target is in tiny / long-distance mode.
    spike_reject_disable_in_tiny_mode: false

  # ---------------------------------------------------------------------------
  # distractor_mode: state we enter after a confirmed spike commit; tries to
  # tell the real target from look-alike distractors using YOLO + appearance.
  # ---------------------------------------------------------------------------
  distractor_mode:

    # Entry behaviour: how aggressive the per-frame penalty against known distractors is.
    entry:
      # Stay in distractor mode for at least this many frames after committing.
      jump_reject_distractor_mode_frames: 12
      # Apply a per-frame score penalty against candidates matching known distractors.
      jump_reject_distractor_penalty_enabled: true
      # Max score reduction the distractor penalty can apply.
      jump_reject_distractor_penalty_weight: 0.25
      # Only apply the penalty when similarity to a stored distractor exceeds this.
      jump_reject_distractor_penalty_sim_floor: 0.55
      # Only compare against the last K stored distractor descriptors.
      jump_reject_distractor_penalty_bank_topk: 5
      # Skip distractor mode and go straight to occlusion mode after a jump commit.
      jump_reject_force_occlusion: false

    # While in distractor mode, how we pick the real target out of YOLO candidates.
    selection:
      # If the best candidate's similarity is below this, give up on this frame (and exit distractor mode).
      # Restored to the a098fde baseline (0.70) — 0.55-0.60 was too loose and let the wrong object win.
      distractor_mode_min_similarity: 0.0
      # Required similarity for the winning candidate to be accepted this frame.
      # If below this, the tracker holds (see below_gate_hold_frames) and then,
      # if it never recovers, exits distractor mode (legacy a098 behavior).
      distractor_mode_selected_min_similarity: 0.9
      # Bounded "below-gate" motion hold: when the winning candidate's appearance
      # is below selected_min_similarity, keep tracking the EKF/anchor motion
      # prediction for up to this many consecutive frames instead of immediately
      # exiting distractor mode (which hands control to the base tracker — often
      # the distractor — and unfreezes memory). The counter resets the moment the
      # winner clears the gate again. 0 = disabled (immediate exit, a098 behavior).
      distractor_mode_selected_below_gate_hold_frames: 15
      # When the below-gate hold above is exhausted (target presumed lost), force
      # an immediate handoff to occlusion recovery instead of reverting to the
      # base tracker (which may be confidently locked on the distractor). Still
      # subject to the heavy-camera-motion guard. false = legacy behavior (return
      # the base-tracker box and only enter occlusion if its score later drops).
      distractor_mode_selected_below_gate_force_occlusion: true
      # Hard spatial leash: the selected candidate's centre must be within this many
      # focus-bbox diagonals of the held focus point. Prevents the system from
      # teleporting to a far-away object during distractor mode and on recovery.
      # 1.0 ≈ within one bbox-diagonal of the held box. <= 0 disables the gate.
      distractor_mode_selected_max_focus_dist_frac: -1.0
      # Max YOLO detections considered per frame (0 = all).
      distractor_mode_yolo_topk: 8
      # Max target descriptors stored for ROI similarity scoring.
      distractor_mode_history_limit: 80
      # Reuse the tracker's crop/mapping sizes when building the distractor ROI.
      distractor_mode_use_tracker_mapping: true
      # Multiplicative expansion of the YOLO search ROI while in distractor mode.
      distractor_mode_roi_expand: 1.2
      # Minimum ROI side length (px) — prevents absurdly small crops.
      distractor_mode_roi_min_side: 32
      # How to label ranking mode. Both modes currently sort by the same
      # composite score (appearance + IoU + distance + distractor-bank suppression).
      distractor_compare_mode: "ram"
      # Required top1 - top2 margin to actually switch identity.
      distractor_mode_switch_margin: 0.08
      # Stick with the current pick for this many ambiguous frames.
      distractor_mode_ambiguity_hold_frames: 30
      # Behaviour preset for distractor handling ("standard" or alternatives).
      distractor_mode_behavior_mode: "standard"

    # Composite-score weights used by distractor-mode ranking when
    # `distractor_compare_mode` is "drm".
    drm:
      # Weight on appearance similarity.
      distractor_drm_lam_app: 1.0
      # Weight on IoU with the expected focus box.
      distractor_drm_lam_iou: 1
      # Weight on the distance-from-focus penalty (penalises candidates far from focus).
      distractor_drm_lam_dist: 0
      # Weight on the negative-bank (known-distractor) penalty (EdgeDAM-style suppressor).
      distractor_drm_gamma: 0.5
      # Controls how quickly the distance penalty grows with offset (must be > 0).
      distractor_drm_dist_sigma_factor: 2.5
      # Only use the last K stored distractors in the negative-bank penalty.
      distractor_drm_bank_topk: 5

    # Penalty applied when a candidate is far from the current focus point.
    focus_distance_penalty:
      # Penalise candidates that are far from the focus point.
      distractor_focus_dist_penalty_enabled: true
      # Max score reduction the focus-distance penalty can apply.
      distractor_focus_dist_penalty_weight: 0.35
      # No penalty within this normalised radius of focus.
      distractor_focus_dist_soft_radius: 0.6
      # Full penalty beyond this normalised radius of focus.
      distractor_focus_dist_hard_radius: 2.0

    # Motion-based gating for candidates while in distractor mode.
    motion_gate:
      # Run a Kalman filter "anchor" while in distractor mode (motion prior).
      distractor_mode_anchor_ekf_enabled: True
      # Scale extra ROI padding by EKF position uncertainty (0 = off).
      distractor_mode_anchor_uncertainty_roi_scale: 0.0
      # Cap on uncertainty-driven extra ROI padding (px).
      distractor_mode_anchor_uncertainty_roi_cap: 96.0
      # Reject candidates that are motion-inconsistent with the EKF (Mahalanobis test).
      distractor_mode_mahalanobis_gate_enabled: true
      # Chi-squared threshold for the gate — lower = stricter.
      distractor_mode_mahalanobis_threshold: 9.21
      # Extra measurement variance term (px²) used to soften the gate.
      distractor_mode_mahalanobis_meas_var: 25.0

    # If our pick heavily overlaps a known distractor, briefly lock onto motion only.
    overlap_lock:
      # Engage a motion-only lock when the winning candidate overlaps a distractor heavily.
      # Restored to the a098fde baseline (true) — provides a safety net so the system holds
      # the EKF-predicted bbox instead of flicker-switching identity when two candidates compete.
      distractor_mode_overlap_motion_lock_enabled: True
      # Overlap IoU at which the lock engages.
      distractor_mode_overlap_iou_enter: 0.35
      # Overlap IoU below which the lock is allowed to release.
      distractor_mode_overlap_iou_exit: 0.15
      # Consecutive clear-overlap frames needed before releasing the lock.
      distractor_mode_overlap_clear_frames: 3
      # Hard maximum number of frames the lock can stay engaged.
      distractor_mode_overlap_lock_max_frames: 24

    # When and how distractor mode ends, plus post-exit cooldowns to avoid contamination.
    exit:
      # Keep adding to appearance memory while in distractor mode (risky — can contaminate).
      distractor_mode_update_memory: false
      # Re-init the dynamic SiamABC template when exiting distractor mode.
      distractor_mode_exit_reinit_enabled: True
      # Need this many "stable" frames before exiting distractor mode.
      distractor_mode_exit_stable_frames: 6
      # IoU between consecutive matches needed to count a frame as "stable".
      distractor_mode_exit_same_iou: 0.6
      # Forbid re-entering distractor mode for this many frames after exit.
      distractor_mode_reentry_cooldown_frames: 12
      # Pause memory admissions for this many frames after exit.
      distractor_mode_post_exit_memory_freeze_frames: 8
      # Pause dynamic-template updates for this many frames after exit.
      distractor_mode_post_exit_template_freeze_frames: 8
