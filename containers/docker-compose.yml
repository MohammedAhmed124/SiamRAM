services:
  gpu:
    build:
      context: ..
      dockerfile: containers/Dockerfile.gpu
    image: siamram-gpu
    command: ["bash", "-lc", "sleep infinity"]
    volumes:
      - ..:/app
      - siamram_venv_gpu:/app/.venv
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  siamram_venv_gpu:
