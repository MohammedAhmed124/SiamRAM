weights_path: "training/checkpoints/training_run1/head_epoch_040.pth"

model:
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  backbone: custom_fbnet
  growth_factor: 1.2
  upsample: pixel_shuffle
  pretrained: true
  num_classes: 1
  num_filters: 32
  num_channels: 3
  align: false
  img_size: 256
  stride: 2
  conv_block: sep_conv
  towernum: 2
  model_size: M
  max_layer: 4
  crop_template_features: false
  build_iou_head: true

tracker:
  _target_: models.SiamABC.tracker.SiamABC_Tracker.SiamABCTracker
  penalty_k: 0.062
  window_influence: 0.38
  lr: 0.4
  windowing: cosine
  total_stride: 16
  score_size: 16
  N: 10
  dynamic_update: true
  similarity_score: false
  stride: 2
  smooth: false
  bbox_ratio: 0.5
  template_bbox_offset: 0.2
  search_context: 2
  instance_size: 256
  template_size: 128
  memory_window_size: 20
  dynamic_update_threshold: 0.85
  running_confidence_floor_value: 0.50
  iou_threshold: 0.6
  warmup_frames: 35
  warmup_window_size: 8
  use_iou_score: false
  iou_power: 1.0
  use_iou_gate: False
  use_iou_gate_for_score: false
  iou_gate_warmup_frames: 20
  iou_gate_ema_beta: 0.9
  iou_gate_use_ema: true
  iou_gate_threshold: 0.2
  iou_gate_fail_closed: false



make_trt_engine: False

trt_engine:
  lambda_tta: 0.1
  fp16: True
  cuda_id: 0

# --------------------------------------------------------------------------- #
# SiamRAMTracker (Occlusion & DRM Management)
# --------------------------------------------------------------------------- #
ram_tracker:
  # Path to YOLO weights used for re-detection during occlusion.
  yolo_weights: "checkpoints/yolo11n.pt"
  # YOLO confidence threshold for candidate detections.
  yolo_conf: 0.3
  # If true, restrict YOLO detections to the inferred target class.
  yolo_filter_class: false
  # Frame cadence used while warming up target-class voting.
  yolo_class_detect_frames: 5
  # If true, use compiled YOLO backend (when available).
  copile_yolo: False

  # Descriptor backend selector. Supported: "osnet".
  descriptor_backend: "osnet"
  # OSNet model name from torchreid (examples: osnet_x1_0, osnet_x0_75, osnet_ain_x1_0).
  osnet_model_name: "osnet_x1_0"
  # Optional local OSNet weights path; empty means torchreid pretrained/cached weights.
  osnet_model_path: ""
  # Device for descriptor extraction: "auto", "cuda", or "cpu".
  osnet_device: "auto"
  # Max number of detections per frame passed to OSNet (-1/0 disables cap).
  osnet_max_candidate_batch: 0
  
  # Core Thresholds & Hysteresis
  conf_threshold: 0.50
  reacq_threshold: 0.7
  occ_siam_reacq_threshold: 0.5
  app_match_threshold: 0.6
  occ_siam_margin: 0.5
  nudge_alpha: 0.0
  entry_patience: 1
  enter_occlusion_on_loss: true
  # Warm-up ROI behavior (center crop) used in early frames or after failed recovery.
  yolo_warmup_frames: 60
  yolo_warmup_center_scale: 0.4
  # Processing resolution cap for long edge. 1280 preserves current behavior.
  max_proc_long_edge: 1280
  
  # Dynamic Recovery Module (DRM)
  cand_collection_frames: 1
  drm_tau_sim: 0.6
  drm_mmin: 3
  drm_capacity: 20
  drm_margin: 0.6
  drm_skip_threshold: 23
  drm_top_k: 3
  drm_gamma: 0
  
  # DRM Weights (Lambda)
  drm_lam_app: 1
  drm_lam_cand_vel: 0.0
  drm_lam_dist: 0.0
  drm_lam_cand_dir: 0.0
  drm_lam_time: 0.0
  drm_lam_iou: 0.0
  drm_lam_mot: 0.0
  
  # Velocity & Motion
  vel_score_min_speed: 0.5
  vel_dir_hard_gate: 0.4
  velocity_window_average: 200
  
  # Memory & History
  mem_capacity: 50
  history_decay: 0.1
  conf_history_len: 200
  size_history_len: 200
  history_skip_last: 8
  shrinkage_max_lookback: 30
  
  # ROI Expansion (Normal)
  roi_start_expand: 20
  yolo_search_expand: 100
  search_expand_growth_factor: 1.4
  search_expand_growth_every: 150
  search_expand_max: 500.0
  
  # Tiny / Long Distance ROI Parameters
  long_distance_area_fraction: 0.030
  tiny_roi_start_expand: 8.0
  tiny_yolo_search_expand: 20.0
  tiny_search_expand_growth_factor: 1.3
  tiny_search_expand_growth_every: 50
  tiny_search_expand_max: 40.0

  # Homography estimator mode: "classic" (existing fast grid+affine) or
  # "accurate" (feature-tracked full homography, more robust but slower).
  homography_mode: "classic"

  disable_camera_motion: False
  
  # Logging
  debug: false
