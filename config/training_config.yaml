data:
  csv_path: "../data/train_dataframe.csv"
  seed: 42

tracking:
  template_size: 128
  instance_size: 256
  score_size: 16
  search_context: 2
  max_frame_gap: 130
  total_stride: 16
  template_bbox_offset: 0.2
  search_image_shift: 0.6
  search_image_scale: 0.3
  template_image_shift: 0.01
  template_image_scale: 0.01

dataset:
  train_num_samples: 5000
  train_neg_ratio: 0.5
  val_num_samples: 500
  val_neg_ratio: -0.001
  val_split_ratio: 0.1

dataloader:
  train_batch_size: 32
  val_batch_size: 32
  num_workers: 4

model:
  _target_: models.SiamABC.model.SiamABC.SiamABCNet
  weights_path: "../checkpoints/pretrained/head_epoch_001.pth"
  backbone: custom_fbnet
  growth_factor: 1.2
  upsample: pixel_shuffle
  pretrained: true
  num_classes: 1
  num_filters: 32
  num_channels: 3
  align: false
  img_size: 256
  stride: 2
  conv_block: sep_conv
  towernum: 2
  model_size: M
  max_layer: 4
  crop_template_features: false

training:
  num_epochs: 30
  start_epoch: 1
  backbone_lr: 1.0e-5
  head_lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 3
  eta_min: 1.0e-6
  log_every: 10

loss:
  cls_weight: 1
  bbox_weight: 1
  focal_alpha: 0.25
  focal_gamma: 1.5

output:
  checkpoint_dir: "checkpoints/training_run1/"